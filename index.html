  <title>Multi-Portfolio Task Manager (UTC & Multi-Timezone)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_PORTFOLIOS = ["CTD", "WHO", "WMA JDN"];

    const DEFAULT_CONTACTS = [
      { id: "c1", name: "Dr. Shiv", email: "shiv@example.com", phone: "+1 555-0192", notes: "Project Lead" },
      { id: "c2", name: "Alex Rivera", email: "alex@example.com", phone: "+1 555-0143", notes: "Technical Support" }
    ];

    const TIMEZONES = [
      { id: "UTC", label: "UTC (Coordinated Universal Time)", zone: "UTC" },
      { id: "Delhi", label: "Delhi, India (IST)", zone: "Asia/Kolkata" },
      { id: "Trinidad", label: "Trinidad and Tobago (AST)", zone: "America/Port_of_Spain" },
      { id: "Paris", label: "Paris, France (CET/CEST)", zone: "Europe/Paris" },
      { id: "London", label: "London, UK (GMT/BST)", zone: "Europe/London" },
      { id: "Australia", label: "Australia (Sydney / AEDT)", zone: "Australia/Sydney" },
      { id: "Peru", label: "Peru (PET)", zone: "America/Lima" }
    ];

    const Icons = {

      Download: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Upload: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
      ShieldAlert: () => <svg className="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>,
      Cloud: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 001.09-9.88A5.5 5.5 0 006 8.5a4.5 4.5 0 00-3 6.5z"/></svg>,
      Settings: () => <svg className="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      X: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
      Globe: () => <svg className="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      ChevronDown: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>,
      ChevronRight: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>,
      Users: () => <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      Phone: () => <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>,
      Mail: () => <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    };

    // Searchable Contact Combobox Component
    function SearchableContactInput({ contacts, value, onChange, onSelectContact, placeholder, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const containerRef = useRef(null);

      const filtered = useMemo(() => {
        if (!value) return contacts;
        const q = value.toLowerCase();
        return contacts.filter(c => 
          (c.name || "").toLowerCase().includes(q) ||
          (c.email || "").toLowerCase().includes(q) ||
          (c.phone || "").toLowerCase().includes(q) ||
          (c.notes || "").toLowerCase().includes(q)
        );
      }, [contacts, value]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div ref={containerRef} className="relative w-full">
          <input
            type="text"
            placeholder={placeholder}
            value={value}
            onFocus={() => setIsOpen(true)}
            onChange={(e) => {
              onChange(e.target.value);
              setIsOpen(true);
            }}
            className={className || "w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"}
          />
          {isOpen && filtered.length > 0 && (
            <div className="absolute z-50 left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-slate-800 border border-slate-700 rounded-md shadow-xl">
              {filtered.map(contact => (
                <div
                  key={contact.id}
                  onClick={() => {
                    onSelectContact(contact);
                    setIsOpen(false);
                  }}
                  className="p-2 hover:bg-slate-700/80 cursor-pointer text-xs border-b border-slate-700/40 last:border-0 flex justify-between items-center"
                >
                  <div>
                    <div className="font-bold text-slate-200">{contact.name}</div>
                    <div className="text-[10px] text-slate-400">
                      {contact.email && `${contact.email}`} {contact.phone && `• ${contact.phone}`}
                    </div>
                  </div>
                  {contact.notes && (
                    <span className="text-[9px] bg-indigo-500/20 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-500/30">
                      {contact.notes}
                    </span>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const computeTaskStatus = (subtasks, fallbackStatus = "Not Started") => {
      if (!subtasks || subtasks.length === 0) return fallbackStatus;
      const statuses = subtasks.map(s => s.status || "Not Started");
      if (statuses.some(s => s === "Stalled")) return "Stalled";
      if (statuses.some(s => s === "Deferred")) return "Deferred";
      if (statuses.every(s => s === "Completed")) return "Completed";
      if (statuses.some(s => s === "In Progress" || s === "Completed")) return "In Progress";
      return "Not Started";
    };

    const getSubtaskCompletionStats = (subtasks) => {
      if (!subtasks || subtasks.length === 0) return { total: 0, completed: 0, percent: 0 };
      const completed = subtasks.filter(s => s.status === "Completed").length;
      const total = subtasks.length;
      const percent = Math.round((completed / total) * 100);
      return { total, completed, percent };
    };

    function TaskManagerApp() {
      const [portfolios, setPortfolios] = useState(() => {
        const saved = localStorage.getItem("tm_portfolios");
        return saved ? JSON.parse(saved) : DEFAULT_PORTFOLIOS;
      });
      
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("tm_tasks");
        return saved ? JSON.parse(saved) : [];
      });

      const [contacts, setContacts] = useState(() => {
        const saved = localStorage.getItem("tm_contacts");
        return saved ? JSON.parse(saved) : DEFAULT_CONTACTS;
      });

      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        const saved = localStorage.getItem("tm_firebase_config");
        return saved ? JSON.parse(saved) : null;
      });

      const [selectedZone, setSelectedZone] = useState("UTC");
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState(firebaseConfig ? "connected" : "local");
      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [configInput, setConfigInput] = useState(firebaseConfig ? JSON.stringify(firebaseConfig, null, 2) : "");
      const [newPortfolioName, setNewPortfolioName] = useState("");

      const [activeTab, setActiveTab] = useState("dashboard");
      const [activePortfolio, setActivePortfolio] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [contactSearchQuery, setContactSearchQuery] = useState("");
      const [editingTask, setEditingTask] = useState(null);
      const [editingContact, setEditingContact] = useState(null);
      const [radarTimeframe, setRadarTimeframe] = useState("all");

      const [collapsedRadarTasks, setCollapsedRadarTasks] = useState({});
      const isRemoteUpdate = useRef(false);

      const [form, setForm] = useState({
        portfolio: "CTD",
        title: "",
        leadName: "",
        leadEmail: "",
        leadPhone: "",
        supportName: "",
        supportEmail: "",
        supportPhone: "",
        softDeadline: "",
        hardDeadline: "",
        status: "Not Started",
        remarks: "",
        subtasks: []
      });

      const [contactForm, setContactForm] = useState({
        name: "",
        email: "",
        phone: "",
        notes: ""
      });

      useEffect(() => {
        if (!firebaseConfig) {
          setSyncStatus("local");
          return;
        }

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          const db = firebase.firestore();
          setSyncStatus("connected");

          const unsubscribe = db.collection("task_manager").doc("app_data")
            .onSnapshot((doc) => {
              if (doc.metadata.hasPendingWrites) return;

              if (doc.exists) {
                const data = doc.data();
                isRemoteUpdate.current = true;
                
                if (data.tasks) {
                  setTasks(data.tasks);
                  localStorage.setItem("tm_tasks", JSON.stringify(data.tasks));
                }
                if (data.portfolios) {
                  setPortfolios(data.portfolios);
                  localStorage.setItem("tm_portfolios", JSON.stringify(data.portfolios));
                }
                if (data.contacts) {
                  setContacts(data.contacts);
                  localStorage.setItem("tm_contacts", JSON.stringify(data.contacts));
                }
                
                setTimeout(() => { isRemoteUpdate.current = false; }, 100);
              }
              setIsSyncing(false);
            }, (error) => {
              console.error("Firebase Sync Error:", error);
              setSyncStatus("error");
              setIsSyncing(false);
            });

          return () => unsubscribe();
        } catch (err) {
          console.error("Firebase init failed:", err);
          setSyncStatus("error");
          setIsSyncing(false);
        }
      }, [firebaseConfig]);

      useEffect(() => {
        localStorage.setItem("tm_portfolios", JSON.stringify(portfolios));
      }, [portfolios]);

      useEffect(() => {
        localStorage.setItem("tm_contacts", JSON.stringify(contacts));
      }, [contacts]);

      useEffect(() => {
        localStorage.setItem("tm_tasks", JSON.stringify(tasks));

        if (isRemoteUpdate.current) return;
        
        if (firebaseConfig && firebase.apps.length && syncStatus === "connected") {
          setIsSyncing(true);
          const db = firebase.firestore();
          db.collection("task_manager").doc("app_data").set({
            tasks,
            portfolios,
            contacts,
            lastUpdated: new Date().toISOString()
          }, { merge: true })
          .then(() => setIsSyncing(false))
          .catch(() => setIsSyncing(false));
        }
      }, [tasks, portfolios, contacts]);

      const handleFactoryReset = () => {
        const confirmFirst = confirm("Warning: This will clear all local tasks, portfolios, contacts, and configuration. Are you sure?");
        if (!confirmFirst) return;
        const confirmSecond = confirm("Double check: Do you want to proceed with clearing all cached local data?");
        if (!confirmSecond) return;

        localStorage.removeItem("tm_portfolios");
        localStorage.removeItem("tm_tasks");
        localStorage.removeItem("tm_contacts");
        localStorage.removeItem("tm_firebase_config");

        setPortfolios(DEFAULT_PORTFOLIOS);
        setTasks([]);
        setContacts(DEFAULT_CONTACTS);
        setFirebaseConfig(null);
        setSyncStatus("local");
        setConfigInput("");
        setActivePortfolio("ALL");
        setEditingTask(null);
        setEditingContact(null);

        alert("Local cache cleared! Task manager has been reset.");
      };

      const formatDeadline = (utcIsoString, zoneKey = selectedZone) => {
        if (!utcIsoString) return "";
        try {
          const tzObj = TIMEZONES.find(t => t.id === zoneKey) || TIMEZONES[0];
          const date = new Date(utcIsoString);
          if (isNaN(date.getTime())) return utcIsoString;

          return new Intl.DateTimeFormat("en-US", {
            timeZone: tzObj.zone,
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
          }).format(date);
        } catch (e) {
          return utcIsoString;
        }
      };

      const isoFromPicker = (localPickerVal) => {
        if (!localPickerVal) return "";
        return new Date(localPickerVal + "Z").toISOString();
      };

      const pickerFromIso = (isoStr) => {
        if (!isoStr) return "";
        try {
          const d = new Date(isoStr);
          if (isNaN(d.getTime())) return isoStr;
          return d.toISOString().slice(0, 16);
        } catch (e) {
          return "";
        }
      };

      const handleAddPortfolio = () => {
        const trimmed = newPortfolioName.trim();
        if (!trimmed) return;
        if (portfolios.includes(trimmed)) return alert("Portfolio already exists!");
        setPortfolios([...portfolios, trimmed]);
        setNewPortfolioName("");
      };

      const handleDeletePortfolio = (portfolioToDelete, e) => {
        e.stopPropagation();
        const assignedTasks = tasks.filter(t => t.portfolio === portfolioToDelete);
        if (assignedTasks.length > 0) {
          alert(`Cannot delete portfolio "${portfolioToDelete}" because ${assignedTasks.length} task(s) are assigned to it.`);
          return;
        }
        if (confirm(`Are you sure you want to delete portfolio "${portfolioToDelete}"?`)) {
          const updated = portfolios.filter(p => p !== portfolioToDelete);
          setPortfolios(updated);
          if (activePortfolio === portfolioToDelete) setActivePortfolio("ALL");
        }
      };

      const handleSaveContact = (e) => {
        e.preventDefault();
        if (!contactForm.name.trim()) return alert("Contact name is required");

        if (editingContact) {
          setContacts(contacts.map(c => c.id === editingContact.id ? { ...contactForm, id: editingContact.id } : c));
          setEditingContact(null);
        } else {
          setContacts([...contacts, { ...contactForm, id: "c_" + Date.now().toString() }]);
        }

        setContactForm({ name: "", email: "", phone: "", notes: "" });
      };

      const deleteContact = (id) => {
        if (confirm("Are you sure you want to delete this contact?")) {
          setContacts(contacts.filter(c => c.id !== id));
        }
      };

      const addSubtask = () => {
        const updatedSubtasks = [
          ...form.subtasks,
          { id: Date.now(), title: "", soft1: "", soft2: "", hard: "", lead: "", support: "", status: "Not Started" }
        ];
        setForm({
          ...form,
          subtasks: updatedSubtasks,
          status: computeTaskStatus(updatedSubtasks, form.status)
        });
      };

      const updateSubtask = (id, field, value) => {
        const updatedSubtasks = form.subtasks.map(s => s.id === id ? { ...s, [field]: value } : s);
        setForm({
          ...form,
          subtasks: updatedSubtasks,
          status: computeTaskStatus(updatedSubtasks, form.status)
        });
      };

      const removeSubtask = (id) => {
        const updatedSubtasks = form.subtasks.filter(s => s.id !== id);
        setForm({ 
          ...form, 
          subtasks: updatedSubtasks,
          status: computeTaskStatus(updatedSubtasks, form.status)
        });
      };

      const handleSaveFirebaseConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          if (!parsed.apiKey || !parsed.projectId) {
            alert("Invalid config! Ensure your object includes apiKey and projectId.");
            return;
          }
          localStorage.setItem("tm_firebase_config", JSON.stringify(parsed));
          setFirebaseConfig(parsed);
          setShowFirebaseModal(false);
          alert("Firebase connected! Live cloud sync is active.");
        } catch (e) {
          alert("Invalid JSON format. Please paste a valid firebaseConfig object.");
        }
      };

      const handleDisconnectFirebase = () => {
        if (confirm("Disconnect Firebase cloud sync for this device?")) {
          localStorage.removeItem("tm_firebase_config");
          setFirebaseConfig(null);
          setSyncStatus("local");
          setConfigInput("");
          setShowFirebaseModal(false);
        }
      };

      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!form.title) return alert("Task title required");

        const computedStatus = computeTaskStatus(form.subtasks, form.status);

        if (editingTask) {
          setTasks(tasks.map(t => t.id === editingTask.id ? { ...form, status: computedStatus, id: editingTask.id } : t));
          setEditingTask(null);
        } else {
          setTasks([...tasks, { ...form, status: computedStatus, id: Date.now().toString(), createdAt: new Date().toISOString() }]);
        }

        setForm({
          portfolio: portfolios[0] || "CTD",
          title: "", leadName: "", leadEmail: "", leadPhone: "",
          supportName: "", supportEmail: "", supportPhone: "",
          softDeadline: "", hardDeadline: "", status: "Not Started", remarks: "", subtasks: []
        });
        setActiveTab("tasks");
      };

      const handleStatusChange = (taskId, newStatus) => {
        setTasks(tasks.map(t => {
          if (t.id === taskId) {
            if (t.subtasks && t.subtasks.length > 0) {
              const updatedSubtasks = t.subtasks.map(sub => ({ ...sub, status: newStatus }));
              return { ...t, status: newStatus, subtasks: updatedSubtasks };
            }
            return { ...t, status: newStatus };
          }
          return t;
        }));
      };

      const handleSubtaskStatusChange = (taskId, subtaskId, newSubStatus) => {
        setTasks(tasks.map(t => {
          if (t.id === taskId) {
            const updatedSubtasks = (t.subtasks || []).map(s => s.id === subtaskId ? { ...s, status: newSubStatus } : s);
            const computedOverallStatus = computeTaskStatus(updatedSubtasks, t.status);
            return {
              ...t,
              subtasks: updatedSubtasks,
              status: computedOverallStatus
            };
          }
          return t;
        }));
      };

      const deleteTask = (id) => {
        if (confirm("Are you sure you want to delete this task?")) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesPortfolio = activePortfolio === "ALL" || task.portfolio === activePortfolio;
          const matchesSearch = (task.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                                (task.leadName || "").toLowerCase().includes(searchQuery.toLowerCase());
          return matchesPortfolio && matchesSearch;
        });
      }, [tasks, activePortfolio, searchQuery]);

      const filteredContacts = useMemo(() => {
        return contacts.filter(c => {
          return (c.name || "").toLowerCase().includes(contactSearchQuery.toLowerCase()) ||
                 (c.email || "").toLowerCase().includes(contactSearchQuery.toLowerCase()) ||
                 (c.phone || "").toLowerCase().includes(contactSearchQuery.toLowerCase()) ||
                 (c.notes || "").toLowerCase().includes(contactSearchQuery.toLowerCase());
        });
      }, [contacts, contactSearchQuery]);

      const activeTasks = useMemo(() => filteredTasks.filter(t => t.status !== "Completed"), [filteredTasks]);
      const archivedTasks = useMemo(() => filteredTasks.filter(t => t.status === "Completed"), [filteredTasks]);

      const overallProgressStats = useMemo(() => {
        if (activeTasks.length === 0) return { totalWeight: 0, completedWeight: 0, percent: 100 };
        let totalItems = 0;
        let completedItems = 0;

        activeTasks.forEach(task => {
          if (task.subtasks && task.subtasks.length > 0) {
            task.subtasks.forEach(s => {
              totalItems += 1;
              if (s.status === "Completed") completedItems += 1;
            });
          } else {
            totalItems += 1;
            if (task.status === "Completed") completedItems += 1;
          }
        });

        const percent = totalItems === 0 ? 0 : Math.round((completedItems / totalItems) * 100);
        return { totalItems, completedItems, percent };
      }, [activeTasks]);

      const isOverdue = (utcIsoString) => {
        if (!utcIsoString) return false;
        const d = new Date(utcIsoString);
        return d < new Date();
      };

      const isWithinDays = (utcIsoString, days) => {
        if (!utcIsoString) return false;
        const d = new Date(utcIsoString);
        const now = new Date();
        const limit = new Date(now.getTime() + days * 24 * 60 * 60 * 1000);
        return d >= now && d <= limit;
      };

      const groupedRadarTasks = useMemo(() => {
        const taskGroupMap = {};

        activeTasks.forEach(task => {
          const parentContact = task.leadPhone || task.leadEmail || "No contact info";
          const items = [];

          if (task.softDeadline) {
            items.push({
              id: `${task.id}_parent_soft`,
              taskId: task.id,
              taskTitle: task.title,
              portfolio: task.portfolio,
              itemType: "Parent Task",
              itemTitle: task.title,
              deadlineType: "Soft",
              deadlineDateIso: task.softDeadline,
              lead: task.leadName || "Unassigned",
              contact: parentContact,
              support: task.supportName,
              isOverdue: isOverdue(task.softDeadline),
              isWithin7: isWithinDays(task.softDeadline, 7),
              isWithin30: isWithinDays(task.softDeadline, 30)
            });
          }

          if (task.hardDeadline) {
            items.push({
              id: `${task.id}_parent_hard`,
              taskId: task.id,
              taskTitle: task.title,
              portfolio: task.portfolio,
              itemType: "Parent Task",
              itemTitle: task.title,
              deadlineType: "Hard",
              deadlineDateIso: task.hardDeadline,
              lead: task.leadName || "Unassigned",
              contact: parentContact,
              support: task.supportName,
              isOverdue: isOverdue(task.hardDeadline),
              isWithin7: isWithinDays(task.hardDeadline, 7),
              isWithin30: isWithinDays(task.hardDeadline, 30)
            });
          }

          if (task.subtasks && task.subtasks.length > 0) {
            task.subtasks.forEach((sub, idx) => {
              if (sub.status === "Completed") return;

              const subLead = sub.lead || task.leadName || "Unassigned";
              const subSupport = sub.support || task.supportName;

              if (sub.soft1) {
                items.push({
                  id: `${task.id}_sub_${sub.id}_soft1`,
                  taskId: task.id,
                  taskTitle: task.title,
                  portfolio: task.portfolio,
                  itemType: `Sub-Task #${idx + 1}`,
                  itemTitle: sub.title || `Sub-Task #${idx + 1}`,
                  deadlineType: "Soft 1",
                  deadlineDateIso: sub.soft1,
                  lead: subLead,
                  contact: parentContact,
                  support: subSupport,
                  isOverdue: isOverdue(sub.soft1),
                  isWithin7: isWithinDays(sub.soft1, 7),
                  isWithin30: isWithinDays(sub.soft1, 30)
                });
              }

              if (sub.soft2) {
                items.push({
                  id: `${task.id}_sub_${sub.id}_soft2`,
                  taskId: task.id,
                  taskTitle: task.title,
                  portfolio: task.portfolio,
                  itemType: `Sub-Task #${idx + 1}`,
                  itemTitle: sub.title || `Sub-Task #${idx + 1}`,
                  deadlineType: "Soft 2",
                  deadlineDateIso: sub.soft2,
                  lead: subLead,
                  contact: parentContact,
                  support: subSupport,
                  isOverdue: isOverdue(sub.soft2),
                  isWithin7: isWithinDays(sub.soft2, 30)
                });
              }

              if (sub.hard) {
                items.push({
                  id: `${task.id}_sub_${sub.id}_hard`,
                  taskId: task.id,
                  taskTitle: task.title,
                  portfolio: task.portfolio,
                  itemType: `Sub-Task #${idx + 1}`,
                  itemTitle: sub.title || `Sub-Task #${idx + 1}`,
                  deadlineType: "Hard",
                  deadlineDateIso: sub.hard,
                  lead: subLead,
                  contact: parentContact,
                  support: subSupport,
                  isOverdue: isOverdue(sub.hard),
                  isWithin7: isWithinDays(sub.hard, 7),
                  isWithin30: isWithinDays(sub.hard, 30)
                });
              }
            });
          }

          const filteredItems = items.filter(item => {
            if (radarTimeframe === "overdue") return item.isOverdue;
            if (radarTimeframe === "7days") return item.isOverdue || item.isWithin7;
            if (radarTimeframe === "30days") return item.isOverdue || item.isWithin30;
            return true;
          }).sort((a, b) => new Date(a.deadlineDateIso) - new Date(b.deadlineDateIso));

          if (filteredItems.length > 0) {
            taskGroupMap[task.id] = {
              task,
              items: filteredItems,
              earliestDeadline: filteredItems[0].deadlineDateIso
            };
          }
        });

        return Object.values(taskGroupMap).sort((a, b) => new Date(a.earliestDeadline) - new Date(b.earliestDeadline));
      }, [activeTasks, radarTimeframe]);

      const toggleRadarCollapse = (taskId) => {
        setCollapsedRadarTasks(prev => ({
          ...prev,
          [taskId]: !prev[taskId]
        }));
      };

      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ portfolios, tasks, contacts, firebaseConfig }, null, 2));
        const anchor = document.createElement("a");
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `task_manager_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      };

      const handleImportJSON = (e) => {
        const fileReader = new FileReader();
        fileReader.readAsText(e.target.files[0], "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.portfolios) setPortfolios(parsed.portfolios);
            if (parsed.tasks) setTasks(parsed.tasks);
            if (parsed.contacts) setContacts(parsed.contacts);
            if (parsed.firebaseConfig) {
              setFirebaseConfig(parsed.firebaseConfig);
              localStorage.setItem("tm_firebase_config", JSON.stringify(parsed.firebaseConfig));
            }
            alert("Backup imported successfully!");
          } catch (err) {
            alert("Invalid JSON backup file.");
          }
        };
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header Bar */}
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-indigo-600 p-2 rounded-lg">
                <Icons.FolderPlus />
              </div>
              <h1 className="text-xl font-bold tracking-wide">Shiv's Task Hub</h1>
            </div>

            <div className="flex flex-wrap items-center space-x-3">
              <div className="flex items-center space-x-1.5 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
                <Icons.Globe />
                <span className="text-slate-400 font-medium">View Time Zone:</span>
                <select
                  value={selectedZone}
                  onChange={e => setSelectedZone(e.target.value)}
                  className="bg-transparent text-indigo-300 font-semibold focus:outline-none cursor-pointer"
                >
                  {TIMEZONES.map(tz => (
                    <option key={tz.id} value={tz.id} className="bg-slate-800 text-slate-200">
                      {tz.label}
                    </option>
                  ))}
                </select>
              </div>

              <button 
                onClick={() => setShowFirebaseModal(true)}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border ${
                  syncStatus === 'connected' 
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' 
                    : 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                }`}
              >
                <Icons.Cloud />
                <span>{syncStatus === 'connected' ? (isSyncing ? 'Syncing...' : 'Cloud Connected') : 'Local Storage Only'}</span>
                <Icons.Settings />
              </button>

              <button onClick={handleExportJSON} className="flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs">
                <Icons.Download />
                <span>Export</span>
              </button>

              <label className="flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs cursor-pointer">
                <Icons.Upload />
                <span>Import</span>
                <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
              </label>

              <button 
                onClick={handleFactoryReset} 
                className="flex items-center space-x-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded text-xs transition-colors"
                title="Reset application local cache"
              >
                <Icons.Trash />
                <span>Reset Cache</span>
              </button>
            </div>
          </header>

          {/* Portfolio Selector Sub-Header */}
          <div className="bg-slate-800/50 border-b border-slate-700 px-6 py-2 flex items-center justify-between overflow-x-auto">
            <div className="flex items-center space-x-2">
              <span className="text-xs text-slate-400 font-semibold uppercase mr-2">Portfolio:</span>
              <button
                onClick={() => setActivePortfolio("ALL")}
                className={`px-3 py-1 rounded-md text-xs font-medium ${activePortfolio === "ALL" ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600"}`}
              >
                All Portfolios
              </button>
              {portfolios.map(p => (
                <div key={p} className="flex items-center">
                  <button
                    onClick={() => setActivePortfolio(p)}
                    className={`pl-3 pr-1.5 py-1 rounded-l-md text-xs font-medium flex items-center ${activePortfolio === p ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600"}`}
                  >
                    <span>{p}</span>
                  </button>
                  <button
                    onClick={(e) => handleDeletePortfolio(p, e)}
                    title={`Delete Portfolio ${p}`}
                    className={`pr-2 pl-1 py-1.5 rounded-r-md text-xs font-medium border-l ${
                      activePortfolio === p 
                        ? "bg-indigo-600 border-indigo-500 text-indigo-200 hover:text-white hover:bg-indigo-700" 
                        : "bg-slate-700 border-slate-600 text-slate-400 hover:text-red-400 hover:bg-slate-600"
                    }`}
                  >
                    <Icons.X />
                  </button>
                </div>
              ))}
            </div>

            <div className="flex items-center space-x-2">
              <input 
                type="text" 
                placeholder="New Portfolio..." 
                value={newPortfolioName} 
                onChange={e => setNewPortfolioName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleAddPortfolio()}
                className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200"
              />
              <button onClick={handleAddPortfolio} className="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1 rounded text-indigo-400 font-semibold">+ Add</button>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="bg-slate-800 border-b border-slate-700 px-6 flex space-x-6 text-sm">
            {[
              { id: "dashboard", label: "Dashboard & Alerts", icon: Icons.AlertCircle },
              { id: "add", label: editingTask ? "Edit Task" : "Add Task", icon: Icons.Plus },
              { id: "tasks", label: `Active Tasks (${activeTasks.length})`, icon: Icons.Clock },
              { id: "contacts", label: `Contacts Directory (${contacts.length})`, icon: Icons.Users },
              { id: "archive", label: `Completed Archive (${archivedTasks.length})`, icon: Icons.Archive },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex items-center space-x-2 py-3 border-b-2 font-medium transition-colors ${
                  activeTab === tab.id ? "border-indigo-500 text-indigo-400" : "border-transparent text-slate-400 hover:text-slate-200"
                }`}
              >
                <tab.icon />
                <span>{tab.label}</span>
              </button>
            ))}
          </div>

          {/* Main Content Area */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto">
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3 shadow-lg">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-base font-bold text-slate-100 flex items-center space-x-2">
                        <Icons.CheckCircle />
                        <span>Overall Active Tasks Progress</span>
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Track progress across all current sub-tasks & active task items
                      </p>
                    </div>
                    <div className="text-right">
                      <span className="text-2xl font-extrabold text-indigo-400">
                        {overallProgressStats.percent}%
                      </span>
                      <div className="text-[11px] text-slate-400 font-medium">
                        {overallProgressStats.completedItems} / {overallProgressStats.totalItems} Items Completed
                      </div>
                    </div>
                  </div>

                  <div className="w-full bg-slate-900 rounded-full h-3.5 overflow-hidden border border-slate-700/80 p-0.5">
                    <div 
                      className={`h-full transition-all duration-500 rounded-full ${
                        overallProgressStats.percent === 100 
                          ? 'bg-emerald-500' 
                          : overallProgressStats.percent > 40 
                            ? 'bg-indigo-500' 
                            : 'bg-amber-500'
                      }`} 
                      style={{ width: `${overallProgressStats.percent}%` }}
                    ></div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-red-400">Overdue Hard Deadlines</span>
                      <Icons.ShieldAlert />
                    </div>
                    <p className="text-2xl font-bold text-red-200">
                      {activeTasks.filter(t => isOverdue(t.hardDeadline)).length}
                    </p>
                  </div>

                  <div className="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-amber-400">Due Next 7 Days (Soft)</span>
                      <Icons.Clock />
                    </div>
                    <p className="text-2xl font-bold text-amber-200">
                      {activeTasks.filter(t => isWithinDays(t.softDeadline, 7)).length}
                    </p>
                  </div>

                  <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-emerald-400">Active In Progress</span>
                      <Icons.CheckCircle />
                    </div>
                    <p className="text-2xl font-bold text-emerald-200">
                      {activeTasks.filter(t => t.status === "In Progress").length}
                    </p>
                  </div>
                </div>

                <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700 pb-3">
                    <div>
                      <h2 className="text-lg font-semibold flex items-center space-x-2 text-indigo-400">
                        <Icons.AlertCircle />
                        <span>Follow-Up Radar</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-0.5">Showing times in <strong>{TIMEZONES.find(t => t.id === selectedZone)?.label}</strong></p>
                    </div>

                    <div className="flex space-x-1 bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
                      {[
                        { id: "all", label: "All Pending" },
                        { id: "overdue", label: "Overdue Only" },
                        { id: "7days", label: "Next 7 Days" },
                        { id: "30days", label: "Next 30 Days" },
                      ].map(filter => (
                        <button
                          key={filter.id}
                          onClick={() => setRadarTimeframe(filter.id)}
                          className={`px-2.5 py-1 rounded font-medium ${radarTimeframe === filter.id ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-slate-200"}`}
                        >
                          {filter.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-4">
                    {groupedRadarTasks.length === 0 ? (
                      <div className="p-6 text-center text-slate-400 text-sm">No follow-ups found for the selected timeframe.</div>
                    ) : (
                      groupedRadarTasks.map(group => {
                        const task = group.task;
                        const hasSubtasks = task.subtasks && task.subtasks.length > 0;
                        const stats = getSubtaskCompletionStats(task.subtasks);
                        const isCollapsed = collapsedRadarTasks[task.id];

                        const barColor = stats.percent === 100 
                          ? 'bg-emerald-500' 
                          : stats.percent > 33 
                            ? 'bg-indigo-500' 
                            : 'bg-amber-500';

                        return (
                          <div key={task.id} className="bg-slate-900/80 border border-slate-700/80 rounded-xl overflow-hidden">
                            <div className="p-4 bg-slate-800/90 border-b border-slate-700/70 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                              <div className="space-y-1.5 flex-1">
                                <div className="flex items-center space-x-2">
                                  {hasSubtasks && (
                                    <button 
                                      onClick={() => toggleRadarCollapse(task.id)}
                                      className="p-1 hover:bg-slate-700 rounded text-slate-400 hover:text-slate-200 transition-colors"
                                    >
                                      {isCollapsed ? <Icons.ChevronRight /> : <Icons.ChevronDown />}
                                    </button>
                                  )}
                                  <span className="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 text-xs rounded border border-indigo-500/30 font-semibold">{task.portfolio}</span>
                                  <h3 className="font-semibold text-slate-100 text-sm">{task.title}</h3>
                                </div>

                                <div className="text-xs text-slate-400 flex flex-wrap space-x-4 pl-1">
                                  <span><strong className="text-slate-300">Lead:</strong> <span className="text-indigo-300 font-medium">{task.leadName || 'Unassigned'}</span></span>
                                  {task.supportName && <span><strong className="text-slate-300">Support:</strong> {task.supportName}</span>}
                                  <span className="text-slate-400">Status: <strong className="text-indigo-300">{task.status}</strong></span>
                                </div>

                                {hasSubtasks && (
                                  <div className="mt-2 bg-slate-900 border border-slate-700/70 p-2 rounded-lg space-y-1 max-w-sm">
                                    <div className="flex justify-between items-center text-[10px]">
                                      <span className="font-medium text-slate-400">Sub-task Progress</span>
                                      <span className="font-bold text-slate-200">{stats.completed} / {stats.total} ({stats.percent}%)</span>
                                    </div>
                                    <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden border border-slate-700">
                                      <div 
                                        className={`h-full transition-all duration-300 rounded-full ${barColor}`} 
                                        style={{ width: `${stats.percent}%` }}
                                      ></div>
                                    </div>
                                  </div>
                                )}
                              </div>

                              <div className="flex items-center space-x-3">
                                <button
                                  onClick={() => {
                                    setEditingTask(task);
                                    setForm(task);
                                    setActiveTab("add");
                                  }}
                                  className="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-indigo-300 font-semibold transition-colors"
                                >
                                  View / Edit Task
                                </button>
                              </div>
                            </div>

                            {!isCollapsed && (
                              <div className="p-3 space-y-2 bg-slate-900/40">
                                {group.items.map(item => (
                                  <div key={item.id} className="bg-slate-800/60 border border-slate-700/60 p-3 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs">
                                    <div className="space-y-0.5">
                                      <div className="flex items-center space-x-2">
                                        <span className="px-1.5 py-0.5 bg-slate-700 text-slate-300 rounded text-[10px] font-medium">{item.itemType}</span>
                                        <span className="font-semibold text-slate-200">{item.itemTitle}</span>
                                      </div>
                                      <div className="text-slate-400 text-[11px]">
                                        Assigned to: <span className="text-slate-300 font-medium">{item.lead}</span>
                                      </div>
                                    </div>

                                    <div className="text-right">
                                      <div className="text-[10px] uppercase font-bold text-slate-400">{item.deadlineType} Deadline</div>
                                      <div className={`font-semibold ${item.isOverdue ? 'text-red-400' : 'text-amber-400'}`}>
                                        {formatDeadline(item.deadlineDateIso)} {item.isOverdue && '(OVERDUE)'}
                                      </div>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === "add" && (
              <form onSubmit={handleSaveTask} className="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6 max-w-4xl mx-auto">
                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                  <h2 className="text-lg font-semibold">{editingTask ? "Edit Task Details" : "Create New Portfolio Task"}</h2>
                  <span className="text-xs text-indigo-400 bg-indigo-500/10 border border-indigo-500/30 px-2.5 py-1 rounded">All input times are saved in UTC</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Portfolio</label>

            )}
          </main>

          {showFirebaseModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-100 flex items-center space-x-2">
                    <Icons.Cloud />
                    <span>Firebase Cloud Sync Settings</span>
                  </h3>
                  {firebaseConfig && (
                    <button onClick={handleDisconnectFirebase} className="text-xs text-red-400 hover:underline font-medium">Disconnect</button>
                  )}
                </div>
                <p className="text-xs text-slate-400">
                  Paste your `firebaseConfig` object from your Firebase Console below to turn on instant multi-device syncing.
                </p>
                <textarea 
                  rows="8"
                  value={configInput}
                  onChange={e => setConfigInput(e.target.value)}
                  placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app-id",\n  "storageBucket": "your-app.appspot.com",\n  "messagingSenderId": "123456789",\n  "appId": "1:123456789:web:abc"\n}`}
                  className="w-full bg-slate-900 border border-slate-700 rounded p-3 font-mono text-xs text-slate-200"
                ></textarea>
                <div className="flex justify-end space-x-2">
                  <button onClick={() => setShowFirebaseModal(false)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs">Cancel</button>
                  <button onClick={handleSaveFirebaseConfig} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">Connect & Save</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<TaskManagerApp />, document.getElementById('root'));
  </script>
</body>
</html>
