<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Portfolio Task Manager with Cloud Sync</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- APP CONTAINER -->
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    // INITIAL APP STATE
    const DEFAULT_PORTFOLIOS = ["CTD", "WHO", "WMA JDN"];

    let state = {
      portfolios: JSON.parse(localStorage.getItem("tm_portfolios")) || DEFAULT_PORTFOLIOS,
      tasks: JSON.parse(localStorage.getItem("tm_tasks")) || [],
      firebaseConfig: JSON.parse(localStorage.getItem("tm_firebase_config")) || null,
      activeTab: "dashboard",
      activePortfolio: "ALL",
      searchQuery: "",
      editingTaskId: null,
      showFirebaseModal: false,
      newPortfolioName: "",
      subtaskCounter: 0,
      formSubtasks: []
    };

    let db = null;
    let syncStatus = "local";

    // FIREBASE INITIALIZATION
    function initFirebase() {
      if (!state.firebaseConfig) {
        syncStatus = "local";
        render();
        return;
      }
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(state.firebaseConfig);
        }
        db = firebase.firestore();
        syncStatus = "connected";
        render();

        db.collection("task_manager").doc("app_data")
          .onSnapshot((doc) => {
            if (doc.exists) {
              const data = doc.data();
              if (data.tasks) {
                state.tasks = data.tasks;
                localStorage.setItem("tm_tasks", JSON.stringify(data.tasks));
              }
              if (data.portfolios) {
                state.portfolios = data.portfolios;
                localStorage.setItem("tm_portfolios", JSON.stringify(data.portfolios));
              }
              render();
            }
          }, (err) => {
            console.error("Firebase sync error:", err);
            syncStatus = "error";
            render();
          });
      } catch (e) {
        console.error("Firebase init failed:", e);
        syncStatus = "error";
        render();
      }
    }

    function saveState() {
      localStorage.setItem("tm_portfolios", JSON.stringify(state.portfolios));
      localStorage.setItem("tm_tasks", JSON.stringify(state.tasks));

      if (db && syncStatus === "connected") {
        db.collection("task_manager").doc("app_data").set({
          tasks: state.tasks,
          portfolios: state.portfolios,
          lastUpdated: new Date().toISOString()
        }, { merge: true });
      }
      render();
    }

    // ACTION HANDLERS
    window.setTab = function(tab) {
      state.activeTab = tab;
      if (tab !== "add") {
        state.editingTaskId = null;
        state.formSubtasks = [];
      }
      render();
    };

    window.setPortfolioFilter = function(p) {
      state.activePortfolio = p;
      render();
    };

    window.addPortfolio = function() {
      const name = state.newPortfolioName.trim();
      if (!name) return;
      if (state.portfolios.includes(name)) return alert("Portfolio already exists!");
      state.portfolios.push(name);
      state.newPortfolioName = "";
      saveState();
    };

    window.addSubtaskRow = function() {
      state.subtaskCounter++;
      state.formSubtasks.push({
        id: "st_" + Date.now() + "_" + state.subtaskCounter,
        title: "",
        soft1: "",
        soft2: "",
        hard: "",
        lead: "",
        support: ""
      });
      render();
    };

    window.removeSubtaskRow = function(id) {
      state.formSubtasks = state.formSubtasks.filter(s => s.id !== id);
      render();
    };

    window.handleTaskSubmit = function(e) {
      e.preventDefault();
      const form = e.target;
      const title = form.title.value.trim();
      if (!title) return alert("Task Title is required!");

      // Collect Subtasks from DOM
      const subtasks = state.formSubtasks.map(sub => {
        return {
          id: sub.id,
          title: document.getElementById(`st_title_${sub.id}`)?.value || "",
          soft1: document.getElementById(`st_soft1_${sub.id}`)?.value || "",
          soft2: document.getElementById(`st_soft2_${sub.id}`)?.value || "",
          hard: document.getElementById(`st_hard_${sub.id}`)?.value || "",
          lead: document.getElementById(`st_lead_${sub.id}`)?.value || "",
          support: document.getElementById(`st_support_${sub.id}`)?.value || ""
        };
      });

      const taskData = {
        id: state.editingTaskId || Date.now().toString(),
        portfolio: form.portfolio.value,
        status: form.status.value,
        title: title,
        softDeadline: form.softDeadline.value,
        hardDeadline: form.hardDeadline.value,
        leadName: form.leadName.value,
        leadEmail: form.leadEmail.value,
        leadPhone: form.leadPhone.value,
        supportName: form.supportName.value,
        supportEmail: form.supportEmail.value,
        supportPhone: form.supportPhone.value,
        remarks: form.remarks.value,
        subtasks: subtasks,
        createdAt: new Date().toISOString()
      };

      if (state.editingTaskId) {
        state.tasks = state.tasks.map(t => t.id === state.editingTaskId ? taskData : t);
        state.editingTaskId = null;
      } else {
        state.tasks.push(taskData);
      }

      state.formSubtasks = [];
      state.activeTab = "tasks";
      saveState();
    };

    window.editTask = function(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      state.editingTaskId = id;
      state.formSubtasks = task.subtasks ? [...task.subtasks] : [];
      state.activeTab = "add";
      render();
    };

    window.deleteTask = function(id) {
      if (confirm("Are you sure you want to delete this task?")) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        saveState();
      }
    };

    window.updateStatus = function(id, status) {
      const task = state.tasks.find(t => t.id === id);
      if (task) {
        task.status = status;
        saveState();
      }
    };

    window.toggleFirebaseModal = function(show) {
      state.showFirebaseModal = show;
      render();
    };

    window.saveFirebaseConfig = function() {
      const input = document.getElementById("fb_config_input").value;
      try {
        const parsed = JSON.parse(input);
        if (!parsed.apiKey || !parsed.projectId) {
          alert("Invalid config! Needs apiKey and projectId.");
          return;
        }
        state.firebaseConfig = parsed;
        localStorage.setItem("tm_firebase_config", JSON.stringify(parsed));
        state.showFirebaseModal = false;
        initFirebase();
      } catch (e) {
        alert("Invalid JSON block format.");
      }
    };

    window.exportJSON = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ portfolios: state.portfolios, tasks: state.tasks }, null, 2));
      const anchor = document.createElement("a");
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `task_manager_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    };

    window.importJSON = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.portfolios) state.portfolios = parsed.portfolios;
          if (parsed.tasks) state.tasks = parsed.tasks;
          saveState();
          alert("Backup imported successfully!");
        } catch (err) {
          alert("Invalid backup JSON file.");
        }
      };
      reader.readAsText(file);
    };

    // RENDER UI FUNCTION
    function render() {
      const app = document.getElementById("app");

      const filteredTasks = state.tasks.filter(task => {
        const matchP = state.activePortfolio === "ALL" || task.portfolio === state.activePortfolio;
        const matchQ = (task.title || "").toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                       (task.leadName || "").toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchP && matchQ;
      });

      const activeTasks = filteredTasks.filter(t => t.status !== "Completed");
      const archivedTasks = filteredTasks.filter(t => t.status === "Completed");

      const isDueThisWeek = (dateStr) => {
        if (!dateStr) return false;
        const d = new Date(dateStr);
        const now = new Date();
        const nextWeek = new Date();
        nextWeek.setDate(now.getDate() + 7);
        return d >= now && d <= nextWeek;
      };

      const isOverdue = (dateStr) => {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date();
      };

      const editingTask = state.editingTaskId ? state.tasks.find(t => t.id === state.editingTaskId) : null;

      app.innerHTML = `
        <!-- HEADER -->
        <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
          <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            </div>
            <h1 class="text-xl font-bold tracking-wide">Multi-Portfolio Task Hub</h1>
          </div>

          <div class="flex items-center space-x-3">
            <button onclick="toggleFirebaseModal(true)" class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border ${
              syncStatus === 'connected' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-amber-500/10 border-amber-500/30 text-amber-400'
            }">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 001.09-9.88A5.5 5.5 0 006 8.5a4.5 4.5 0 00-3 6.5z"/></svg>
              <span>${syncStatus === 'connected' ? 'Cloud Connected' : 'Local Storage Only'}</span>
            </button>

            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs">Export</button>
            <label class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs cursor-pointer">
              Import
              <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
            </label>
          </div>
        </header>

        <!-- PORTFOLIO SELECTOR BAR -->
        <div class="bg-slate-800/50 border-b border-slate-700 px-6 py-2 flex items-center justify-between overflow-x-auto">
          <div class="flex items-center space-x-2">
            <span class="text-xs text-slate-400 font-semibold uppercase mr-2">Portfolio:</span>
            <button onclick="setPortfolioFilter('ALL')" class="px-3 py-1 rounded-md text-xs font-medium ${state.activePortfolio === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'}">All</button>
            ${state.portfolios.map(p => `
              <button onclick="setPortfolioFilter('${p}')" class="px-3 py-1 rounded-md text-xs font-medium ${state.activePortfolio === p ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'}">${p}</button>
            `).join('')}
          </div>

          <div class="flex items-center space-x-2">
            <input type="text" id="new_port_input" placeholder="New Portfolio..." value="${state.newPortfolioName}" oninput="state.newPortfolioName=this.value" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200" />
            <button onclick="addPortfolio()" class="bg-slate-700 hover:bg-slate-600 text-xs px-2 py-1 rounded text-indigo-400 font-semibold">+ Add</button>
          </div>
        </div>

        <!-- TABS -->
        <div class="bg-slate-800 border-b border-slate-700 px-6 flex space-x-6 text-sm">
          <button onclick="setTab('dashboard')" class="py-3 border-b-2 font-medium ${state.activeTab === 'dashboard' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}">Dashboard & Alerts</button>
          <button onclick="setTab('add')" class="py-3 border-b-2 font-medium ${state.activeTab === 'add' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}">${state.editingTaskId ? 'Edit Task' : 'Add Task'}</button>
          <button onclick="setTab('tasks')" class="py-3 border-b-2 font-medium ${state.activeTab === 'tasks' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}">Active Tasks (${activeTasks.length})</button>
          <button onclick="setTab('archive')" class="py-3 border-b-2 font-medium ${state.activeTab === 'archive' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400'}">Archive (${archivedTasks.length})</button>
        </div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
          ${state.activeTab === 'dashboard' ? `
            <div class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-red-500/10 border border-red-500/20 p-4 rounded-xl">
                  <span class="text-sm font-semibold text-red-400">Overdue Hard Deadlines</span>
                  <p class="text-2xl font-bold text-red-200">${activeTasks.filter(t => isOverdue(t.hardDeadline)).length}</p>
                </div>
                <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
                  <span class="text-sm font-semibold text-amber-400">Due This Week (Soft)</span>
                  <p class="text-2xl font-bold text-amber-200">${activeTasks.filter(t => isDueThisWeek(t.softDeadline)).length}</p>
                </div>
                <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl">
                  <span class="text-sm font-semibold text-emerald-400">In Progress</span>
                  <p class="text-2xl font-bold text-emerald-200">${activeTasks.filter(t => t.status === 'In Progress').length}</p>
                </div>
              </div>

              <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">Follow-Up Radar (Urgent Action Items)</h2>
                <div class="space-y-3">
                  ${activeTasks.filter(t => isOverdue(t.hardDeadline) || isDueThisWeek(t.softDeadline)).length === 0 
                    ? `<p class="text-sm text-slate-400">No urgent follow-ups needed for this week.</p>`
                    : activeTasks.filter(t => isOverdue(t.hardDeadline) || isDueThisWeek(t.softDeadline)).map(task => `
                        <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700/60 flex justify-between items-center">
                          <div>
                            <span class="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 text-xs rounded border border-indigo-500/30 font-semibold">${task.portfolio}</span>
                            <h3 class="font-medium text-slate-200 mt-1">${task.title}</h3>
                            <div class="text-xs text-slate-400 mt-1">Lead: ${task.leadName || 'Unassigned'} (${task.leadPhone || task.leadEmail || 'No contact'})</div>
                          </div>
                          <span class="text-xs px-2 py-1 rounded font-semibold ${isOverdue(task.hardDeadline) ? 'bg-red-500/20 text-red-300' : 'bg-amber-500/20 text-amber-300'}">Hard: ${task.hardDeadline || 'None'}</span>
                        </div>
                      `).join('')
                  }
                </div>
              </div>
            </div>
          ` : ''}

          ${state.activeTab === 'add' ? `
            <form onsubmit="handleTaskSubmit(event)" class="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6 max-w-4xl mx-auto">
              <h2 class="text-lg font-semibold border-b border-slate-700 pb-3">${editingTask ? 'Edit Task' : 'Create New Task'}</h2>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Portfolio</label>
                  <select name="portfolio" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                    ${state.portfolios.map(p => `<option value="${p}" ${editingTask && editingTask.portfolio === p ? 'selected' : ''}>${p}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Status</label>
                  <select name="status" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200">
                    ${["Not Started", "In Progress", "Stalled", "Deferred", "Completed"].map(s => `
                      <option value="${s}" ${editingTask && editingTask.status === s ? 'selected' : ''}>${s}</option>
                    `).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Task Title</label>
                <input type="text" name="title" value="${editingTask ? editingTask.title : ''}" placeholder="Enter task title..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" required />
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/40 p-4 rounded-lg border border-slate-700/50">
                <div>
                  <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Soft Deadline</label>
                  <input type="date" name="softDeadline" value="${editingTask ? editingTask.softDeadline : ''}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase text-red-400 mb-1">Hard Deadline</label>
                  <input type="date" name="hardDeadline" value="${editingTask ? editingTask.hardDeadline : ''}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                </div>
              </div>

              <div class="space-y-3 border-t border-slate-700 pt-4">
                <h3 class="text-xs font-semibold uppercase text-slate-400">Lead Contact Info</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <input type="text" name="leadName" placeholder="Lead Name" value="${editingTask ? editingTask.leadName : ''}" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                  <input type="email" name="leadEmail" placeholder="Email" value="${editingTask ? editingTask.leadEmail : ''}" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                  <input type="tel" name="leadPhone" placeholder="Phone" value="${editingTask ? editingTask.leadPhone : ''}" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                </div>
              </div>

              <div class="space-y-3 border-t border-slate-700 pt-4">
                <h3 class="text-xs font-semibold uppercase text-slate-400">Supporting Contact Info</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <input type="text" name="supportName" placeholder="Support Name" value="${editingTask ? editingTask.supportName : ''}" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                  <input type="email" name="supportEmail" placeholder="Email" value="${editingTask ? editingTask.supportEmail : ''}" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                  <input type="tel" name="supportPhone" placeholder="Phone" value="${editingTask ? editingTask.supportPhone : ''}" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                </div>
              </div>

              <!-- SUBTASKS SECTION -->
              <div class="space-y-4 border-t border-slate-700 pt-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-xs font-semibold uppercase text-indigo-400">Sub-Tasks</h3>
                  <button type="button" onclick="addSubtaskRow()" class="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1 rounded">+ Add Sub-Task</button>
                </div>

                ${state.formSubtasks.map((sub, idx) => `
                  <div class="bg-slate-900/60 border border-slate-700/70 p-4 rounded-lg space-y-3">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-slate-400">Sub-Task #${idx + 1}</span>
                      <button type="button" onclick="removeSubtaskRow('${sub.id}')" class="text-xs text-red-400 hover:underline">Remove</button>
                    </div>
                    <input type="text" id="st_title_${sub.id}" placeholder="Sub-task title..." value="${sub.title || ''}" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                      <input type="date" id="st_soft1_${sub.id}" value="${sub.soft1 || ''}" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                      <input type="date" id="st_soft2_${sub.id}" value="${sub.soft2 || ''}" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                      <input type="date" id="st_hard_${sub.id}" value="${sub.hard || ''}" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                      <input type="text" id="st_lead_${sub.id}" placeholder="Lead Person" value="${sub.lead || ''}" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                      <input type="text" id="st_support_${sub.id}" placeholder="Support Person" value="${sub.support || ''}" class="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                    </div>
                  </div>
                `).join('')}
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Remarks</label>
                <textarea name="remarks" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" placeholder="Add remarks...">${editingTask ? editingTask.remarks : ''}</textarea>
              </div>

              <div class="flex justify-end space-x-3 pt-4">
                <button type="button" onclick="setTab('tasks')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded text-sm">Cancel</button>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded text-sm">${editingTask ? 'Update Task' : 'Save Task'}</button>
              </div>
            </form>
          ` : ''}

          ${state.activeTab === 'tasks' ? `
            <div class="space-y-4">
              <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <input type="text" placeholder="Search tasks or personnel..." value="${state.searchQuery}" oninput="state.searchQuery=this.value; render();" class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-lg px-4 py-1.5 text-sm text-slate-200" />
              </div>

              <div class="space-y-3">
                ${activeTasks.length === 0 ? `<div class="bg-slate-800/40 p-8 text-center text-slate-400 rounded-xl border border-slate-700">No active tasks found.</div>` :
                  activeTasks.map(task => `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3">
                      <div class="flex flex-col md:flex-row justify-between gap-4">
                        <div class="space-y-2 flex-1">
                          <div class="flex items-center space-x-3">
                            <span class="px-2.5 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-xs font-semibold">${task.portfolio}</span>
                            <h3 class="font-semibold text-base text-slate-100">${task.title}</h3>
                          </div>
                          <div class="text-xs text-slate-400">Lead: ${task.leadName || 'Unassigned'} ${task.leadPhone ? '(' + task.leadPhone + ')' : ''}</div>
                          ${task.remarks ? `<p class="italic text-slate-300 text-xs bg-slate-900/50 p-2 rounded">${task.remarks}</p>` : ''}
                        </div>

                        <div class="flex flex-col justify-between items-end gap-3 min-w-[180px]">
                          <select onchange="updateStatus('${task.id}', this.value)" class="bg-slate-900 border border-slate-700 rounded text-xs px-2 py-1 font-semibold text-slate-200">
                            ${["Not Started", "In Progress", "Stalled", "Deferred", "Completed"].map(s => `
                              <option value="${s}" ${task.status === s ? 'selected' : ''}>${s}</option>
                            `).join('')}
                          </select>
                          <div class="text-right text-xs">
                            ${task.softDeadline ? `<div class="text-amber-400">Soft: ${task.softDeadline}</div>` : ''}
                            ${task.hardDeadline ? `<div class="text-red-400 font-semibold">Hard: ${task.hardDeadline}</div>` : ''}
                          </div>
                          <div class="flex space-x-2">
                            <button onclick="editTask('${task.id}')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs">Edit</button>
                            <button onclick="deleteTask('${task.id}')" class="px-2 py-1 bg-red-600/30 hover:bg-red-600/50 text-red-300 rounded text-xs">Delete</button>
                          </div>
                        </div>
                      </div>

                      ${task.subtasks && task.subtasks.length > 0 ? `
                        <div class="border-t border-slate-700/60 pt-3 space-y-2">
                          <h4 class="text-xs font-semibold text-indigo-400">Sub-Tasks (${task.subtasks.length})</h4>
                          ${task.subtasks.map(s => `
                            <div class="bg-slate-900/60 p-2 rounded border border-slate-700/40 text-xs flex justify-between items-center">
                              <span>${s.title} ${s.lead ? '(Lead: ' + s.lead + ')' : ''}</span>
                              <div class="flex space-x-2 text-[11px]">
                                ${s.soft1 ? `<span class="text-amber-400">S1: ${s.soft1}</span>` : ''}
                                ${s.hard ? `<span class="text-red-400 font-bold">H: ${s.hard}</span>` : ''}
                              </div>
                            </div>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `).join('')
                }
              </div>
            </div>
          ` : ''}

          ${state.activeTab === 'archive' ? `
            <div class="space-y-3">
              ${archivedTasks.length === 0 ? `<div class="bg-slate-800/40 p-8 text-center text-slate-400 rounded-xl border border-slate-700">No completed tasks archived.</div>` :
                archivedTasks.map(task => `
                  <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4 flex justify-between items-center opacity-75">
                    <div>
                      <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 text-xs rounded border border-emerald-500/30 font-semibold">${task.portfolio}</span>
                      <h3 class="line-through font-medium text-slate-300 inline-block ml-2">${task.title}</h3>
                    </div>
                    <button onclick="updateStatus('${task.id}', 'In Progress')" class="text-xs text-indigo-400 hover:underline">Unarchive</button>
                  </div>
                `).join('')
              }
            </div>
          ` : ''}
        </main>

        <!-- FIREBASE MODAL -->
        ${state.showFirebaseModal ? `
          <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4">
              <h3 class="text-lg font-bold text-slate-100">Connect Free Firebase Sync</h3>
              <p class="text-xs text-slate-400">Paste your valid firebaseConfig JSON object below.</p>
              <textarea id="fb_config_input" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded p-3 font-mono text-xs text-slate-200" placeholder='{\n  "apiKey": "AIzaSy...",\n  "projectId": "your-app-id"\n}'></textarea>
              <div class="flex justify-end space-x-2">
                <button onclick="toggleFirebaseModal(false)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs">Cancel</button>
                <button onclick="saveFirebaseConfig()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">Connect & Sync</button>
              </div>
            </div>
          </div>
        ` : ''}
      `;
    }

    // INITIAL LAUNCH
    initFirebase();
  </script>
</body>
</html>
