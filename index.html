<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Portfolio Task Manager with Cloud Sync</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
  
  <!-- Firebase SDKs (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { 
      FolderPlus, Plus, Search, Calendar, UserCheck, AlertCircle, 
      CheckCircle2, Clock, Archive, Download, Upload, Filter, 
      Phone, Mail, Trash2, Edit2, ShieldAlert, Cloud, CloudOff, Settings
    } = lucideReact;

    const DEFAULT_PORTFOLIOS = ["CTD", "WHO", "WMA JDN"];

    function TaskManagerApp() {
      // Data States
      const [portfolios, setPortfolios] = useState(() => {
        const saved = localStorage.getItem("tm_portfolios");
        return saved ? JSON.parse(saved) : DEFAULT_PORTFOLIOS;
      });
      
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("tm_tasks");
        return saved ? JSON.parse(saved) : [];
      });

      // Firebase Config State
      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        const saved = localStorage.getItem("tm_firebase_config");
        return saved ? JSON.parse(saved) : null;
      });

      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState("local"); // 'local', 'connected', 'syncing', 'error'
      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [configInput, setConfigInput] = useState("");

      // UI States
      const [activeTab, setActiveTab] = useState("dashboard");
      const [activePortfolio, setActivePortfolio] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [newPortfolioName, setNewPortfolioName] = useState("");
      const [editingTask, setEditingTask] = useState(null);

      // Task Form State
      const [form, setForm] = useState({
        portfolio: "CTD",
        title: "",
        leadName: "",
        leadEmail: "",
        leadPhone: "",
        supportName: "",
        supportEmail: "",
        supportPhone: "",
        softDeadline: "",
        hardDeadline: "",
        status: "Not Started",
        remarks: "",
        subtasks: []
      });

      // Initialize Firebase Connection
      useEffect(() => {
        if (!firebaseConfig) {
          setSyncStatus("local");
          return;
        }

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          const db = firebase.firestore();
          setSyncStatus("connected");

          // Set up real-time listener
          const unsubscribe = db.collection("task_manager").doc("app_data")
            .onSnapshot((doc) => {
              if (doc.exists) {
                const data = doc.data();
                if (data.tasks) {
                  setTasks(data.tasks);
                  localStorage.setItem("tm_tasks", JSON.stringify(data.tasks));
                }
                if (data.portfolios) {
                  setPortfolios(data.portfolios);
                  localStorage.setItem("tm_portfolios", JSON.stringify(data.portfolios));
                }
              }
            }, (error) => {
              console.error("Firebase Sync Error:", error);
              setSyncStatus("error");
            });

          return () => unsubscribe();
        } catch (err) {
          console.error("Firebase init failed:", err);
          setSyncStatus("error");
        }
      }, [firebaseConfig]);

      // Local Backup Persistence
      useEffect(() => {
        localStorage.setItem("tm_portfolios", JSON.stringify(portfolios));
      }, [portfolios]);

      useEffect(() => {
        localStorage.setItem("tm_tasks", JSON.stringify(tasks));
        
        // Push changes to Cloud if connected
        if (firebaseConfig && firebase.apps.length && syncStatus === "connected") {
          setIsSyncing(true);
          const db = firebase.firestore();
          db.collection("task_manager").doc("app_data").set({
            tasks,
            portfolios,
            lastUpdated: new Date().toISOString()
          }, { merge: true })
          .then(() => setIsSyncing(false))
          .catch((err) => {
            console.error("Cloud push failed:", err);
            setIsSyncing(false);
          });
        }
      }, [tasks, portfolios]);

      // Save Firebase Config
      const handleSaveFirebaseConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          if (!parsed.apiKey || !parsed.projectId) {
            alert("Invalid config! Ensure your object includes apiKey and projectId.");
            return;
          }
          setFirebaseConfig(parsed);
          localStorage.setItem("tm_firebase_config", JSON.stringify(parsed));
          setShowFirebaseModal(false);
          alert("Firebase configuration saved! Live auto-sync is now active.");
        } catch (e) {
          alert("Invalid JSON format. Please paste the firebaseConfig object validly.");
        }
      };

      // Task Helpers
      const addSubtaskField = () => {
        setForm({
          ...form,
          subtasks: [
            ...form.subtasks,
            { id: Date.now(), title: "", soft1: "", soft2: "", hard: "", lead: "", support: "", status: "Pending" }
          ]
        });
      };

      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!form.title) return alert("Task title required");

        if (editingTask) {
          setTasks(tasks.map(t => t.id === editingTask.id ? { ...form, id: editingTask.id } : t));
          setEditingTask(null);
        } else {
          setTasks([...tasks, { ...form, id: Date.now().toString(), createdAt: new Date().toISOString() }]);
        }

        setForm({
          portfolio: portfolios[0] || "CTD",
          title: "", leadName: "", leadEmail: "", leadPhone: "",
          supportName: "", supportEmail: "", supportPhone: "",
          softDeadline: "", hardDeadline: "", status: "Not Started", remarks: "", subtasks: []
        });
        setActiveTab("tasks");
      };

      const handleStatusChange = (taskId, newStatus) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
      };

      const deleteTask = (id) => {
        if (confirm("Are you sure you want to delete this task?")) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      // Filters
      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesPortfolio = activePortfolio === "ALL" || task.portfolio === activePortfolio;
          const matchesSearch = task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                task.leadName.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesPortfolio && matchesSearch;
        });
      }, [tasks, activePortfolio, searchQuery]);

      const activeTasks = useMemo(() => filteredTasks.filter(t => t.status !== "Completed"), [filteredTasks]);
      const archivedTasks = useMemo(() => filteredTasks.filter(t => t.status === "Completed"), [filteredTasks]);

      // Deadlines Calculation
      const isDueThisWeek = (dateStr) => {
        if (!dateStr) return false;
        const d = new Date(dateStr);
        const now = new Date();
        const nextWeek = new Date();
        nextWeek.setDate(now.getDate() + 7);
        return d >= now && d <= nextWeek;
      };

      const isOverdue = (dateStr) => {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date();
      };

      // Import / Export
      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ portfolios, tasks }, null, 2));
        const anchor = document.createElement("a");
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `task_manager_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      };

      const handleImportJSON = (e) => {
        const fileReader = new FileReader();
        fileReader.readAsText(e.target.files[0], "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.portfolios) setPortfolios(parsed.portfolios);
            if (parsed.tasks) setTasks(parsed.tasks);
            alert("Backup imported successfully!");
          } catch (err) {
            alert("Invalid JSON backup file.");
          }
        };
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header */}
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-indigo-600 p-2 rounded-lg">
                <FolderPlus className="w-6 h-6 text-white" />
              </div>
              <h1 className="text-xl font-bold tracking-wide">Multi-Portfolio Task Hub</h1>
            </div>

            <div className="flex items-center space-x-3">
              {/* Cloud Status Indicator */}
              <button 
                onClick={() => setShowFirebaseModal(true)}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border ${
                  syncStatus === 'connected' 
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' 
                    : 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                }`}
              >
                {syncStatus === 'connected' ? <Cloud className="w-3.5 h-3.5" /> : <CloudOff className="w-3.5 h-3.5" />}
                <span>{syncStatus === 'connected' ? (isSyncing ? 'Syncing...' : 'Cloud Connected') : 'Local Storage Only'}</span>
                <Settings className="w-3 h-3 ml-1 opacity-70" />
              </button>

              <button onClick={handleExportJSON} className="flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs">
                <Download className="w-3.5 h-3.5" />
                <span>Export</span>
              </button>

              <label className="flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs cursor-pointer">
                <Upload className="w-3.5 h-3.5" />
                <span>Import</span>
                <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
              </label>
            </div>
          </header>

          {/* Sub-Header Portfolio Selector */}
          <div className="bg-slate-800/50 border-b border-slate-700 px-6 py-2 flex items-center space-x-2 overflow-x-auto">
            <span className="text-xs text-slate-400 font-semibold uppercase mr-2">Portfolio:</span>
            <button
              onClick={() => setActivePortfolio("ALL")}
              className={`px-3 py-1 rounded-md text-xs font-medium ${activePortfolio === "ALL" ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600"}`}
            >
              All Portfolios
            </button>
            {portfolios.map(p => (
              <button
                key={p}
                onClick={() => setActivePortfolio(p)}
                className={`px-3 py-1 rounded-md text-xs font-medium ${activePortfolio === p ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600"}`}
              >
                {p}
              </button>
            ))}
          </div>

          {/* Navigation Tabs */}
          <div className="bg-slate-800 border-b border-slate-700 px-6 flex space-x-6 text-sm">
            {[
              { id: "dashboard", label: "Dashboard & Alerts", icon: AlertCircle },
              { id: "add", label: editingTask ? "Edit Task" : "Add Task", icon: Plus },
              { id: "tasks", label: `Active Tasks (${activeTasks.length})`, icon: Clock },
              { id: "archive", label: `Completed Archive (${archivedTasks.length})`, icon: Archive },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex items-center space-x-2 py-3 border-b-2 font-medium transition-colors ${
                  activeTab === tab.id ? "border-indigo-500 text-indigo-400" : "border-transparent text-slate-400 hover:text-slate-200"
                }`}
              >
                <tab.icon className="w-4 h-4" />
                <span>{tab.label}</span>
              </button>
            ))}
          </div>

          {/* Main Content Area */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto">
            
            {/* TAB 1: DASHBOARD */}
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                {/* Immediate Attention Flags */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-red-400">Overdue Hard Deadlines</span>
                      <ShieldAlert className="w-5 h-5 text-red-400" />
                    </div>
                    <p className="text-2xl font-bold text-red-200">
                      {activeTasks.filter(t => isOverdue(t.hardDeadline)).length}
                    </p>
                  </div>

                  <div className="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-amber-400">Due This Week (Soft)</span>
                      <Clock className="w-5 h-5 text-amber-400" />
                    </div>
                    <p className="text-2xl font-bold text-amber-200">
                      {activeTasks.filter(t => isDueThisWeek(t.softDeadline)).length}
                    </p>
                  </div>

                  <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-emerald-400">In Progress</span>
                      <CheckCircle2 className="w-5 h-5 text-emerald-400" />
                    </div>
                    <p className="text-2xl font-bold text-emerald-200">
                      {activeTasks.filter(t => t.status === "In Progress").length}
                    </p>
                  </div>
                </div>

                {/* Immediate Follow-Up Radar */}
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-5">
                  <h2 className="text-lg font-semibold mb-4 flex items-center space-x-2 text-indigo-400">
                    <AlertCircle className="w-5 h-5" />
                    <span>Follow-Up Radar (Urgent Action Items)</span>
                  </h2>

                  <div className="space-y-3">
                    {activeTasks.filter(t => isOverdue(t.hardDeadline) || isDueThisWeek(t.softDeadline)).length === 0 ? (
                      <p className="text-sm text-slate-400">No urgent follow-ups required for this week.</p>
                    ) : (
                      activeTasks.filter(t => isOverdue(t.hardDeadline) || isDueThisWeek(t.softDeadline)).map(task => (
                        <div key={task.id} className="bg-slate-900/60 p-4 rounded-lg border border-slate-700/60 flex justify-between items-center">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 text-xs rounded border border-indigo-500/30 font-semibold">{task.portfolio}</span>
                              <h3 className="font-medium text-slate-200">{task.title}</h3>
                            </div>
                            <div className="text-xs text-slate-400 mt-2 flex space-x-4">
                              <span><strong>Lead:</strong> {task.leadName} ({task.leadPhone || task.leadEmail || 'No contact'})</span>
                              {task.supportName && <span><strong>Support:</strong> {task.supportName}</span>}
                            </div>
                          </div>
                          <div className="text-right">
                            <span className={`text-xs px-2 py-1 rounded font-semibold ${isOverdue(task.hardDeadline) ? 'bg-red-500/20 text-red-300' : 'bg-amber-500/20 text-amber-300'}`}>
                              Hard: {task.hardDeadline || 'None'}
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: ADD / EDIT TASK FORM */}
            {activeTab === "add" && (
              <form onSubmit={handleSaveTask} className="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6 max-w-3xl mx-auto">
                <h2 className="text-lg font-semibold border-b border-slate-700 pb-3">{editingTask ? "Edit Task Details" : "Create New Portfolio Task"}</h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Portfolio</label>
                    <select 
                      value={form.portfolio} 
                      onChange={e => setForm({ ...form, portfolio: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200"
                    >
                      {portfolios.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Status</label>
                    <select 
                      value={form.status} 
                      onChange={e => setForm({ ...form, status: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200"
                    >
                      <option value="Not Started">Not Started</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Stalled">Stalled</option>
                      <option value="Deferred">Deferred</option>
                      <option value="Completed">Completed</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Task Name / Title</label>
                  <input 
                    type="text" 
                    value={form.title} 
                    onChange={e => setForm({ ...form, title: e.target.value })}
                    placeholder="Enter main task summary..."
                    className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" 
                    required 
                  />
                </div>

                {/* Deadlines Section */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/40 p-4 rounded-lg border border-slate-700/50">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-amber-400 mb-1">1 Soft Deadline</label>
                    <input 
                      type="date" 
                      value={form.softDeadline} 
                      onChange={e => setForm({ ...form, softDeadline: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase text-red-400 mb-1">1 Hard Deadline</label>
                    <input 
                      type="date" 
                      value={form.hardDeadline} 
                      onChange={e => setForm({ ...form, hardDeadline: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" 
                    />
                  </div>
                </div>

                {/* Lead Person Section */}
                <div className="space-y-3 border-t border-slate-700 pt-4">
                  <h3 className="text-xs font-semibold uppercase text-slate-400">Lead Person Contact Information</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" placeholder="Lead Name" value={form.leadName} onChange={e => setForm({ ...form, leadName: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm" />
                    <input type="email" placeholder="Email (Optional)" value={form.leadEmail} onChange={e => setForm({ ...form, leadEmail: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm" />
                    <input type="tel" placeholder="Phone (Optional)" value={form.leadPhone} onChange={e => setForm({ ...form, leadPhone: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm" />
                  </div>
                </div>

                {/* Supporting Person Section */}
                <div className="space-y-3 border-t border-slate-700 pt-4">
                  <h3 className="text-xs font-semibold uppercase text-slate-400">Supporting Person(s) Contact Information</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" placeholder="Supporting Name" value={form.supportName} onChange={e => setForm({ ...form, supportName: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm" />
                    <input type="email" placeholder="Email (Optional)" value={form.supportEmail} onChange={e => setForm({ ...form, supportEmail: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm" />
                    <input type="tel" placeholder="Phone (Optional)" value={form.supportPhone} onChange={e => setForm({ ...form, supportPhone: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Remarks / Progress Notes</label>
                  <textarea rows="3" value={form.remarks} onChange={e => setForm({ ...form, remarks: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" placeholder="Add additional context..."></textarea>
                </div>

                <div className="flex justify-end space-x-3 pt-4">
                  <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded text-sm">
                    {editingTask ? "Update Task" : "Save Task"}
                  </button>
                </div>
              </form>
            )}

            {/* TAB 3: ACTIVE TASKS */}
            {activeTab === "tasks" && (
              <div className="space-y-4">
                <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
                  <div className="relative flex-1 max-w-md">
                    <Search className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                    <input 
                      type="text" 
                      placeholder="Search tasks or personnel..." 
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-4 py-1.5 text-sm"
                    />
                  </div>
                </div>

                <div className="space-y-3">
                  {activeTasks.length === 0 ? (
                    <div className="bg-slate-800/40 p-8 text-center text-slate-400 rounded-xl border border-slate-700">No active tasks found.</div>
                  ) : (
                    activeTasks.map(task => (
                      <div key={task.id} className="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col md:flex-row justify-between gap-4">
                        <div className="space-y-2 flex-1">
                          <div className="flex items-center space-x-3">
                            <span className="px-2.5 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-xs font-semibold">{task.portfolio}</span>
                            <h3 className="font-semibold text-base text-slate-100">{task.title}</h3>
                          </div>

                          <div className="text-xs text-slate-400 space-y-1">
                            <div><strong>Lead:</strong> {task.leadName || 'Unassigned'} {task.leadPhone && `(${task.leadPhone})`}</div>
                            {task.supportName && <div><strong>Support:</strong> {task.supportName}</div>}
                            {task.remarks && <p className="italic text-slate-300 mt-2 bg-slate-900/50 p-2 rounded">{task.remarks}</p>}
                          </div>
                        </div>

                        <div className="flex flex-col justify-between items-end gap-3 min-w-[200px]">
                          <select 
                            value={task.status} 
                            onChange={e => handleStatusChange(task.id, e.target.value)}
                            className="bg-slate-900 border border-slate-700 rounded text-xs px-2 py-1 font-semibold text-slate-200"
                          >
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Stalled">Stalled</option>
                            <option value="Deferred">Deferred</option>
                            <option value="Completed">Mark Completed</option>
                          </select>

                          <div className="text-right text-xs space-y-1">
                            {task.softDeadline && <div className="text-amber-400">Soft: {task.softDeadline}</div>}
                            {task.hardDeadline && <div className="text-red-400 font-semibold">Hard: {task.hardDeadline}</div>}
                          </div>

                          <div className="flex space-x-2 pt-2">
                            <button onClick={() => { setEditingTask(task); setForm(task); setActiveTab("add"); }} className="p-1 hover:bg-slate-700 rounded text-slate-400 hover:text-slate-200"><Edit2 className="w-4 h-4" /></button>
                            <button onClick={() => deleteTask(task.id)} className="p-1 hover:bg-slate-700 rounded text-slate-400 hover:text-red-400"><Trash2 className="w-4 h-4" /></button>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* TAB 4: COMPLETED ARCHIVE */}
            {activeTab === "archive" && (
              <div className="space-y-3">
                {archivedTasks.length === 0 ? (
                  <div className="bg-slate-800/40 p-8 text-center text-slate-400 rounded-xl border border-slate-700">No completed tasks archived yet.</div>
                ) : (
                  archivedTasks.map(task => (
                    <div key={task.id} className="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4 flex justify-between items-center opacity-75">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 text-xs rounded border border-emerald-500/30 font-semibold">{task.portfolio}</span>
                          <h3 className="line-through font-medium text-slate-300">{task.title}</h3>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">Lead: {task.leadName}</p>
                      </div>
                      <button onClick={() => handleStatusChange(task.id, "In Progress")} className="text-xs text-indigo-400 hover:underline">Unarchive</button>
                    </div>
                  ))
                )}
              </div>
            )}
          </main>

          {/* FIREBASE MODAL SETUP */}
          {showFirebaseModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4">
                <h3 className="text-lg font-bold text-slate-100 flex items-center space-x-2">
                  <Cloud className="w-5 h-5 text-indigo-400" />
                  <span>Connect Free Firebase Sync</span>
                </h3>
                <p className="text-xs text-slate-400">
                  Paste your standard `firebaseConfig` JSON object from your Firebase Console below to enable multi-device live syncing.
                </p>
                <textarea 
                  rows="8"
                  value={configInput}
                  onChange={e => setConfigInput(e.target.value)}
                  placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app-id",\n  "storageBucket": "your-app.appspot.com",\n  "messagingSenderId": "123456789",\n  "appId": "1:123456789:web:abc"\n}`}
                  className="w-full bg-slate-900 border border-slate-700 rounded p-3 font-mono text-xs text-slate-200"
                ></textarea>
                <div className="flex justify-end space-x-2">
                  <button onClick={() => setShowFirebaseModal(false)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs">Cancel</button>
                  <button onClick={handleSaveFirebaseConfig} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">Connect & Sync</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<TaskManagerApp />, document.getElementById('root'));
  </script>
</body>
</html>
