<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Portfolio Task Manager with Cloud Sync</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM (v18 Stable) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase SDKs (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_PORTFOLIOS = ["CTD", "WHO", "WMA JDN"];

    const Icons = {
      FolderPlus: () => <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Search: () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
      AlertCircle: () => <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      CheckCircle: () => <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Clock: () => <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Archive: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>,
      Download: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Upload: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
      ShieldAlert: () => <svg className="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>,
      Cloud: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 001.09-9.88A5.5 5.5 0 006 8.5a4.5 4.5 0 00-3 6.5z"/></svg>,
      Settings: () => <svg className="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
      X: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
    };

    function TaskManagerApp() {
      const [portfolios, setPortfolios] = useState(() => {
        const saved = localStorage.getItem("tm_portfolios");
        return saved ? JSON.parse(saved) : DEFAULT_PORTFOLIOS;
      });
      
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem("tm_tasks");
        return saved ? JSON.parse(saved) : [];
      });

      const [firebaseConfig, setFirebaseConfig] = useState(() => {
        const saved = localStorage.getItem("tm_firebase_config");
        return saved ? JSON.parse(saved) : null;
      });

      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState("local");
      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [configInput, setConfigInput] = useState("");
      const [newPortfolioName, setNewPortfolioName] = useState("");

      const [activeTab, setActiveTab] = useState("dashboard");
      const [activePortfolio, setActivePortfolio] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [editingTask, setEditingTask] = useState(null);
      const [radarTimeframe, setRadarTimeframe] = useState("all");

      const [form, setForm] = useState({
        portfolio: "CTD",
        title: "",
        leadName: "",
        leadEmail: "",
        leadPhone: "",
        supportName: "",
        supportEmail: "",
        supportPhone: "",
        softDeadline: "",
        hardDeadline: "",
        status: "Not Started",
        remarks: "",
        subtasks: []
      });

      // Firebase Sync Listener
      useEffect(() => {
        if (!firebaseConfig) {
          setSyncStatus("local");
          return;
        }

        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }
          const db = firebase.firestore();
          setSyncStatus("connected");

          const unsubscribe = db.collection("task_manager").doc("app_data")
            .onSnapshot((doc) => {
              if (doc.exists) {
                const data = doc.data();
                if (data.tasks) {
                  setTasks(data.tasks);
                  localStorage.setItem("tm_tasks", JSON.stringify(data.tasks));
                }
                if (data.portfolios) {
                  setPortfolios(data.portfolios);
                  localStorage.setItem("tm_portfolios", JSON.stringify(data.portfolios));
                }
              }
            }, (error) => {
              console.error("Firebase Sync Error:", error);
              setSyncStatus("error");
            });

          return () => unsubscribe();
        } catch (err) {
          console.error("Firebase init failed:", err);
          setSyncStatus("error");
        }
      }, [firebaseConfig]);

      useEffect(() => {
        localStorage.setItem("tm_portfolios", JSON.stringify(portfolios));
      }, [portfolios]);

      useEffect(() => {
        localStorage.setItem("tm_tasks", JSON.stringify(tasks));
        
        if (firebaseConfig && firebase.apps.length && syncStatus === "connected") {
          setIsSyncing(true);
          const db = firebase.firestore();
          db.collection("task_manager").doc("app_data").set({
            tasks,
            portfolios,
            lastUpdated: new Date().toISOString()
          }, { merge: true })
          .then(() => setIsSyncing(false))
          .catch(() => setIsSyncing(false));
        }
      }, [tasks, portfolios]);

      // Portfolio Actions
      const handleAddPortfolio = () => {
        const trimmed = newPortfolioName.trim();
        if (!trimmed) return;
        if (portfolios.includes(trimmed)) return alert("Portfolio already exists!");
        setPortfolios([...portfolios, trimmed]);
        setNewPortfolioName("");
      };

      const handleDeletePortfolio = (portfolioToDelete, e) => {
        e.stopPropagation();
        const assignedTasks = tasks.filter(t => t.portfolio === portfolioToDelete);
        if (assignedTasks.length > 0) {
          alert(`Cannot delete portfolio "${portfolioToDelete}" because ${assignedTasks.length} task(s) are assigned to it. Please reassign or delete those tasks first.`);
          return;
        }
        if (confirm(`Are you sure you want to delete portfolio "${portfolioToDelete}"?`)) {
          const updated = portfolios.filter(p => p !== portfolioToDelete);
          setPortfolios(updated);
          if (activePortfolio === portfolioToDelete) {
            setActivePortfolio("ALL");
          }
        }
      };

      // Sub-task Helpers
      const addSubtask = () => {
        setForm({
          ...form,
          subtasks: [
            ...form.subtasks,
            { id: Date.now(), title: "", soft1: "", soft2: "", hard: "", lead: "", support: "", status: "Pending" }
          ]
        });
      };

      const updateSubtask = (id, field, value) => {
        setForm({
          ...form,
          subtasks: form.subtasks.map(s => s.id === id ? { ...s, [field]: value } : s)
        });
      };

      const removeSubtask = (id) => {
        setForm({ ...form, subtasks: form.subtasks.filter(s => s.id !== id) });
      };

      const handleSaveFirebaseConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          if (!parsed.apiKey || !parsed.projectId) {
            alert("Invalid config! Ensure your object includes apiKey and projectId.");
            return;
          }
          setFirebaseConfig(parsed);
          localStorage.setItem("tm_firebase_config", JSON.stringify(parsed));
          setShowFirebaseModal(false);
          alert("Firebase connected! Live cloud sync is active.");
        } catch (e) {
          alert("Invalid JSON format. Please paste a valid firebaseConfig object.");
        }
      };

      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!form.title) return alert("Task title required");

        if (editingTask) {
          setTasks(tasks.map(t => t.id === editingTask.id ? { ...form, id: editingTask.id } : t));
          setEditingTask(null);
        } else {
          setTasks([...tasks, { ...form, id: Date.now().toString(), createdAt: new Date().toISOString() }]);
        }

        setForm({
          portfolio: portfolios[0] || "CTD",
          title: "", leadName: "", leadEmail: "", leadPhone: "",
          supportName: "", supportEmail: "", supportPhone: "",
          softDeadline: "", hardDeadline: "", status: "Not Started", remarks: "", subtasks: []
        });
        setActiveTab("tasks");
      };

      const handleStatusChange = (taskId, newStatus) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
      };

      const deleteTask = (id) => {
        if (confirm("Are you sure you want to delete this task?")) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesPortfolio = activePortfolio === "ALL" || task.portfolio === activePortfolio;
          const matchesSearch = (task.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                                (task.leadName || "").toLowerCase().includes(searchQuery.toLowerCase());
          return matchesPortfolio && matchesSearch;
        });
      }, [tasks, activePortfolio, searchQuery]);

      const activeTasks = useMemo(() => filteredTasks.filter(t => t.status !== "Completed"), [filteredTasks]);
      const archivedTasks = useMemo(() => filteredTasks.filter(t => t.status === "Completed"), [filteredTasks]);

      // Accurate Local Midnight Date Parsing
      const parseLocalDate = (dateStr) => {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return null;
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      };

      const isOverdue = (dateStr) => {
        const d = parseLocalDate(dateStr);
        if (!d) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return d < today;
      };

      const isWithinDays = (dateStr, days) => {
        const d = parseLocalDate(dateStr);
        if (!d) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const limit = new Date(today);
        limit.setDate(today.getDate() + days);
        return d >= today && d <= limit;
      };

      // Follow-Up Radar Scanner
      const followUpItems = useMemo(() => {
        const items = [];

        activeTasks.forEach(task => {
          const parentContact = task.leadPhone || task.leadEmail || "No contact info";

          // Parent Soft Deadline
          if (task.softDeadline) {
            items.push({
              id: `${task.id}_parent_soft`,
              taskId: task.id,
              taskTitle: task.title,
              portfolio: task.portfolio,
              itemType: "Parent Task",
              itemTitle: task.title,
              deadlineType: "Soft",
              deadlineDate: task.softDeadline,
              lead: task.leadName || "Unassigned",
              contact: parentContact,
              support: task.supportName,
              isOverdue: isOverdue(task.softDeadline),
              isWithin7: isWithinDays(task.softDeadline, 7),
              isWithin30: isWithinDays(task.softDeadline, 30)
            });
          }

          // Parent Hard Deadline
          if (task.hardDeadline) {
            items.push({
              id: `${task.id}_parent_hard`,
              taskId: task.id,
              taskTitle: task.title,
              portfolio: task.portfolio,
              itemType: "Parent Task",
              itemTitle: task.title,
              deadlineType: "Hard",
              deadlineDate: task.hardDeadline,
              lead: task.leadName || "Unassigned",
              contact: parentContact,
              support: task.supportName,
              isOverdue: isOverdue(task.hardDeadline),
              isWithin7: isWithinDays(task.hardDeadline, 7),
              isWithin30: isWithinDays(task.hardDeadline, 30)
            });
          }

          // Sub-Tasks
          if (task.subtasks && task.subtasks.length > 0) {
            task.subtasks.forEach((sub, idx) => {
              const subLead = sub.lead || task.leadName || "Unassigned";
              const subSupport = sub.support || task.supportName;

              if (sub.soft1) {
                items.push({
                  id: `${task.id}_sub_${sub.id}_soft1`,
                  taskId: task.id,
                  taskTitle: task.title,
                  portfolio: task.portfolio,
                  itemType: `Sub-Task #${idx + 1}`,
                  itemTitle: sub.title || `Sub-Task #${idx + 1}`,
                  deadlineType: "Soft 1",
                  deadlineDate: sub.soft1,
                  lead: subLead,
                  contact: parentContact,
                  support: subSupport,
                  isOverdue: isOverdue(sub.soft1),
                  isWithin7: isWithinDays(sub.soft1, 7),
                  isWithin30: isWithinDays(sub.soft1, 30)
                });
              }

              if (sub.soft2) {
                items.push({
                  id: `${task.id}_sub_${sub.id}_soft2`,
                  taskId: task.id,
                  taskTitle: task.title,
                  portfolio: task.portfolio,
                  itemType: `Sub-Task #${idx + 1}`,
                  itemTitle: sub.title || `Sub-Task #${idx + 1}`,
                  deadlineType: "Soft 2",
                  deadlineDate: sub.soft2,
                  lead: subLead,
                  contact: parentContact,
                  support: subSupport,
                  isOverdue: isOverdue(sub.soft2),
                  isWithin7: isWithinDays(sub.soft2, 7),
                  isWithin30: isWithinDays(sub.soft2, 30)
                });
              }

              if (sub.hard) {
                items.push({
                  id: `${task.id}_sub_${sub.id}_hard`,
                  taskId: task.id,
                  taskTitle: task.title,
                  portfolio: task.portfolio,
                  itemType: `Sub-Task #${idx + 1}`,
                  itemTitle: sub.title || `Sub-Task #${idx + 1}`,
                  deadlineType: "Hard",
                  deadlineDate: sub.hard,
                  lead: subLead,
                  contact: parentContact,
                  support: subSupport,
                  isOverdue: isOverdue(sub.hard),
                  isWithin7: isWithinDays(sub.hard, 7),
                  isWithin30: isWithinDays(sub.hard, 30)
                });
              }
            });
          }
        });

        return items.filter(item => {
          if (radarTimeframe === "overdue") return item.isOverdue;
          if (radarTimeframe === "7days") return item.isOverdue || item.isWithin7;
          if (radarTimeframe === "30days") return item.isOverdue || item.isWithin30;
          return true;
        }).sort((a, b) => (parseLocalDate(a.deadlineDate) || 0) - (parseLocalDate(b.deadlineDate) || 0));
      }, [activeTasks, radarTimeframe]);

      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ portfolios, tasks }, null, 2));
        const anchor = document.createElement("a");
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", `task_manager_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      };

      const handleImportJSON = (e) => {
        const fileReader = new FileReader();
        fileReader.readAsText(e.target.files[0], "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.portfolios) setPortfolios(parsed.portfolios);
            if (parsed.tasks) setTasks(parsed.tasks);
            alert("Backup imported successfully!");
          } catch (err) {
            alert("Invalid JSON backup file.");
          }
        };
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header Bar */}
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-indigo-600 p-2 rounded-lg">
                <Icons.FolderPlus />
              </div>
              <h1 className="text-xl font-bold tracking-wide">Multi-Portfolio Task Hub</h1>
            </div>

            <div className="flex items-center space-x-3">
              <button 
                onClick={() => setShowFirebaseModal(true)}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border ${
                  syncStatus === 'connected' 
                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' 
                    : 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                }`}
              >
                <Icons.Cloud />
                <span>{syncStatus === 'connected' ? (isSyncing ? 'Syncing...' : 'Cloud Connected') : 'Local Storage Only'}</span>
                <Icons.Settings />
              </button>

              <button onClick={handleExportJSON} className="flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs">
                <Icons.Download />
                <span>Export</span>
              </button>

              <label className="flex items-center space-x-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs cursor-pointer">
                <Icons.Upload />
                <span>Import</span>
                <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
              </label>
            </div>
          </header>

          {/* Portfolio Selector */}
          <div className="bg-slate-800/50 border-b border-slate-700 px-6 py-2 flex items-center justify-between overflow-x-auto">
            <div className="flex items-center space-x-2">
              <span className="text-xs text-slate-400 font-semibold uppercase mr-2">Portfolio:</span>
              <button
                onClick={() => setActivePortfolio("ALL")}
                className={`px-3 py-1 rounded-md text-xs font-medium ${activePortfolio === "ALL" ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600"}`}
              >
                All Portfolios
              </button>
              {portfolios.map(p => (
                <div key={p} className="flex items-center">
                  <button
                    onClick={() => setActivePortfolio(p)}
                    className={`pl-3 pr-1.5 py-1 rounded-l-md text-xs font-medium flex items-center ${activePortfolio === p ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-300 hover:bg-slate-600"}`}
                  >
                    <span>{p}</span>
                  </button>
                  <button
                    onClick={(e) => handleDeletePortfolio(p, e)}
                    title={`Delete Portfolio ${p}`}
                    className={`pr-2 pl-1 py-1.5 rounded-r-md text-xs font-medium border-l ${
                      activePortfolio === p 
                        ? "bg-indigo-600 border-indigo-500 text-indigo-200 hover:text-white hover:bg-indigo-700" 
                        : "bg-slate-700 border-slate-600 text-slate-400 hover:text-red-400 hover:bg-slate-600"
                    }`}
                  >
                    <Icons.X />
                  </button>
                </div>
              ))}
            </div>

            {/* Portfolio Add */}
            <div className="flex items-center space-x-2">
              <input 
                type="text" 
                placeholder="New Portfolio..." 
                value={newPortfolioName} 
                onChange={e => setNewPortfolioName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleAddPortfolio()}
                className="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200"
              />
              <button onClick={handleAddPortfolio} className="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1 rounded text-indigo-400 font-semibold">+ Add</button>
            </div>
          </div>

          {/* Navigation Bar */}
          <div className="bg-slate-800 border-b border-slate-700 px-6 flex space-x-6 text-sm">
            {[
              { id: "dashboard", label: "Dashboard & Alerts", icon: Icons.AlertCircle },
              { id: "add", label: editingTask ? "Edit Task" : "Add Task", icon: Icons.Plus },
              { id: "tasks", label: `Active Tasks (${activeTasks.length})`, icon: Icons.Clock },
              { id: "archive", label: `Completed Archive (${archivedTasks.length})`, icon: Icons.Archive },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex items-center space-x-2 py-3 border-b-2 font-medium transition-colors ${
                  activeTab === tab.id ? "border-indigo-500 text-indigo-400" : "border-transparent text-slate-400 hover:text-slate-200"
                }`}
              >
                <tab.icon />
                <span>{tab.label}</span>
              </button>
            ))}
          </div>

          {/* Main Content */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto">
            {/* TAB 1: DASHBOARD */}
            {activeTab === "dashboard" && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-red-500/10 border border-red-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-red-400">Overdue Hard Deadlines</span>
                      <Icons.ShieldAlert />
                    </div>
                    <p className="text-2xl font-bold text-red-200">
                      {activeTasks.filter(t => isOverdue(t.hardDeadline)).length}
                    </p>
                  </div>

                  <div className="bg-amber-500/10 border border-amber-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-amber-400">Due This Week (Soft)</span>
                      <Icons.Clock />
                    </div>
                    <p className="text-2xl font-bold text-amber-200">
                      {activeTasks.filter(t => isWithinDays(t.softDeadline, 7)).length}
                    </p>
                  </div>

                  <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-semibold text-emerald-400">Active In Progress</span>
                      <Icons.CheckCircle />
                    </div>
                    <p className="text-2xl font-bold text-emerald-200">
                      {activeTasks.filter(t => t.status === "In Progress").length}
                    </p>
                  </div>
                </div>

                {/* Follow-Up Radar */}
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700 pb-3">
                    <h2 className="text-lg font-semibold flex items-center space-x-2 text-indigo-400">
                      <Icons.AlertCircle />
                      <span>Follow-Up Radar (Personnel Follow-up Tracker)</span>
                    </h2>

                    <div className="flex space-x-1 bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
                      {[
                        { id: "all", label: "All Pending" },
                        { id: "overdue", label: "Overdue Only" },
                        { id: "7days", label: "Next 7 Days" },
                        { id: "30days", label: "Next 30 Days" },
                      ].map(filter => (
                        <button
                          key={filter.id}
                          onClick={() => setRadarTimeframe(filter.id)}
                          className={`px-2.5 py-1 rounded font-medium ${radarTimeframe === filter.id ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-slate-200"}`}
                        >
                          {filter.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-3">
                    {followUpItems.length === 0 ? (
                      <div className="p-6 text-center text-slate-400 text-sm">No follow-ups found for the selected timeframe.</div>
                    ) : (
                      followUpItems.map(item => (
                        <div key={item.id} className="bg-slate-900/70 border border-slate-700/70 p-4 rounded-lg flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div className="space-y-1">
                            <div className="flex items-center space-x-2">
                              <span className="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 text-xs rounded border border-indigo-500/30 font-semibold">{item.portfolio}</span>
                              <span className="text-xs px-2 py-0.5 bg-slate-700 text-slate-300 rounded">{item.itemType}</span>
                              <h3 className="font-semibold text-slate-200 text-sm">{item.itemTitle}</h3>
                            </div>
                            
                            <div className="text-xs text-slate-400 flex flex-wrap space-x-4 pt-1">
                              <span><strong className="text-slate-300">Target Person:</strong> <span className="text-indigo-300 font-medium">{item.lead}</span> ({item.contact})</span>
                              {item.support && <span><strong className="text-slate-300">Support:</strong> {item.support}</span>}
                              {item.itemType !== "Parent Task" && <span className="text-slate-500">Parent: {item.taskTitle}</span>}
                            </div>
                          </div>

                          <div className="flex items-center space-x-3 text-right">
                            <div>
                              <div className="text-[10px] uppercase font-bold text-slate-400">{item.deadlineType} Deadline</div>
                              <div className={`text-xs font-semibold ${item.isOverdue ? 'text-red-400' : 'text-amber-400'}`}>
                                {item.deadlineDate} {item.isOverdue && '(OVERDUE)'}
                              </div>
                            </div>
                            <button
                              onClick={() => {
                                const task = tasks.find(t => t.id === item.taskId);
                                if (task) { setEditingTask(task); setForm(task); setActiveTab("add"); }
                              }}
                              className="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-indigo-400 font-semibold"
                            >
                              View Task
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: ADD / EDIT TASK */}
            {activeTab === "add" && (
              <form onSubmit={handleSaveTask} className="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6 max-w-4xl mx-auto">
                <h2 className="text-lg font-semibold border-b border-slate-700 pb-3">{editingTask ? "Edit Task Details" : "Create New Portfolio Task"}</h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Portfolio</label>
                    <select 
                      value={form.portfolio} 
                      onChange={e => setForm({ ...form, portfolio: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200"
                    >
                      {portfolios.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Status</label>
                    <select 
                      value={form.status} 
                      onChange={e => setForm({ ...form, status: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200"
                    >
                      <option value="Not Started">Not Started</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Stalled">Stalled</option>
                      <option value="Deferred">Deferred</option>
                      <option value="Completed">Completed</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Task Name / Title</label>
                  <input 
                    type="text" 
                    value={form.title} 
                    onChange={e => setForm({ ...form, title: e.target.value })}
                    placeholder="Enter main task summary..."
                    className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" 
                    required 
                  />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900/40 p-4 rounded-lg border border-slate-700/50">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-amber-400 mb-1">Task Soft Deadline</label>
                    <input 
                      type="date" 
                      value={form.softDeadline} 
                      onChange={e => setForm({ ...form, softDeadline: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase text-red-400 mb-1">Task Hard Deadline</label>
                    <input 
                      type="date" 
                      value={form.hardDeadline} 
                      onChange={e => setForm({ ...form, hardDeadline: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" 
                    />
                  </div>
                </div>

                <div className="space-y-3 border-t border-slate-700 pt-4">
                  <h3 className="text-xs font-semibold uppercase text-slate-400">Lead Person Contact Information</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" placeholder="Lead Name" value={form.leadName} onChange={e => setForm({ ...form, leadName: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                    <input type="email" placeholder="Email (Optional)" value={form.leadEmail} onChange={e => setForm({ ...form, leadEmail: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                    <input type="tel" placeholder="Phone (Optional)" value={form.leadPhone} onChange={e => setForm({ ...form, leadPhone: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                  </div>
                </div>

                <div className="space-y-3 border-t border-slate-700 pt-4">
                  <h3 className="text-xs font-semibold uppercase text-slate-400">Supporting Person(s) Contact Information</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" placeholder="Supporting Name" value={form.supportName} onChange={e => setForm({ ...form, supportName: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                    <input type="email" placeholder="Email (Optional)" value={form.supportEmail} onChange={e => setForm({ ...form, supportEmail: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                    <input type="tel" placeholder="Phone (Optional)" value={form.supportPhone} onChange={e => setForm({ ...form, supportPhone: e.target.value })} className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" />
                  </div>
                </div>

                <div className="space-y-4 border-t border-slate-700 pt-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-xs font-semibold uppercase text-indigo-400">Sub-Tasks (2 Soft + 1 Hard Deadlines)</h3>
                    <button type="button" onClick={addSubtask} className="bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1 rounded flex items-center space-x-1">
                      <span>+ Add Sub-Task</span>
                    </button>
                  </div>

                  {form.subtasks.map((sub, index) => (
                    <div key={sub.id} className="bg-slate-900/60 border border-slate-700/70 p-4 rounded-lg space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-slate-400">Sub-Task #{index + 1}</span>
                        <button type="button" onClick={() => removeSubtask(sub.id)} className="text-xs text-red-400 hover:underline">Remove</button>
                      </div>
                      
                      <input 
                        type="text" 
                        placeholder="Sub-task title..." 
                        value={sub.title} 
                        onChange={e => updateSubtask(sub.id, "title", e.target.value)} 
                        className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm text-slate-200"
                      />

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div>
                          <label className="text-[10px] uppercase font-bold text-amber-400 block mb-1">Soft Deadline 1</label>
                          <input type="date" value={sub.soft1} onChange={e => updateSubtask(sub.id, "soft1", e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                        </div>
                        <div>
                          <label className="text-[10px] uppercase font-bold text-amber-400 block mb-1">Soft Deadline 2</label>
                          <input type="date" value={sub.soft2} onChange={e => updateSubtask(sub.id, "soft2", e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                        </div>
                        <div>
                          <label className="text-[10px] uppercase font-bold text-red-400 block mb-1">Hard Deadline</label>
                          <input type="date" value={sub.hard} onChange={e => updateSubtask(sub.id, "hard", e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <input type="text" placeholder="Sub-task Lead Person" value={sub.lead} onChange={e => updateSubtask(sub.id, "lead", e.target.value)} className="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                        <input type="text" placeholder="Sub-task Support Person" value={sub.support} onChange={e => updateSubtask(sub.id, "support", e.target.value)} className="bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200" />
                      </div>
                    </div>
                  ))}
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Remarks / Progress Notes</label>
                  <textarea rows="3" value={form.remarks} onChange={e => setForm({ ...form, remarks: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200" placeholder="Add context..."></textarea>
                </div>

                <div className="flex justify-end space-x-3 pt-4">
                  <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded text-sm">
                    {editingTask ? "Update Task" : "Save Task"}
                  </button>
                </div>
              </form>
            )}

            {/* TAB 3: ACTIVE TASKS */}
            {activeTab === "tasks" && (
              <div className="space-y-4">
                <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
                  <div className="relative flex-1 max-w-md">
                    <Icons.Search />
                    <input 
                      type="text" 
                      placeholder="Search tasks or personnel..." 
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-4 py-1.5 text-sm text-slate-200"
                    />
                  </div>
                </div>

                <div className="space-y-3">
                  {activeTasks.length === 0 ? (
                    <div className="bg-slate-800/40 p-8 text-center text-slate-400 rounded-xl border border-slate-700">No active tasks found.</div>
                  ) : (
                    activeTasks.map(task => (
                      <div key={task.id} className="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between gap-4">
                        <div className="flex flex-col md:flex-row justify-between gap-4">
                          <div className="space-y-2 flex-1">
                            <div className="flex items-center space-x-3">
                              <span className="px-2.5 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded text-xs font-semibold">{task.portfolio}</span>
                              <h3 className="font-semibold text-base text-slate-100">{task.title}</h3>
                            </div>

                            <div className="text-xs text-slate-400 space-y-1">
                              <div><strong>Lead:</strong> {task.leadName || 'Unassigned'} {task.leadPhone && `(${task.leadPhone})`}</div>
                              {task.supportName && <div><strong>Support:</strong> {task.supportName}</div>}
                              {task.remarks && <p className="italic text-slate-300 mt-2 bg-slate-900/50 p-2 rounded">{task.remarks}</p>}
                            </div>
                          </div>

                          <div className="flex flex-col justify-between items-end gap-3 min-w-[200px]">
                            <select 
                              value={task.status} 
                              onChange={e => handleStatusChange(task.id, e.target.value)}
                              className="bg-slate-900 border border-slate-700 rounded text-xs px-2 py-1 font-semibold text-slate-200"
                            >
                              <option value="Not Started">Not Started</option>
                              <option value="In Progress">In Progress</option>
                              <option value="Stalled">Stalled</option>
                              <option value="Deferred">Deferred</option>
                              <option value="Completed">Mark Completed</option>
                            </select>

                            <div className="text-right text-xs space-y-1">
                              {task.softDeadline && <div className="text-amber-400">Soft: {task.softDeadline}</div>}
                              {task.hardDeadline && <div className="text-red-400 font-semibold">Hard: {task.hardDeadline}</div>}
                            </div>

                            <div className="flex space-x-2 pt-2">
                              <button onClick={() => { setEditingTask(task); setForm(task); setActiveTab("add"); }} className="p-1 hover:bg-slate-700 rounded text-slate-400 hover:text-slate-200"><Icons.Edit /></button>
                              <button onClick={() => deleteTask(task.id)} className="p-1 hover:bg-slate-700 rounded text-slate-400 hover:text-red-400"><Icons.Trash /></button>
                            </div>
                          </div>
                        </div>

                        {/* Sub-Tasks Display */}
                        {task.subtasks && task.subtasks.length > 0 && (
                          <div className="border-t border-slate-700/60 pt-3 mt-2 space-y-2">
                            <h4 className="text-xs font-semibold text-indigo-400">Sub-Tasks ({task.subtasks.length})</h4>
                            <div className="grid grid-cols-1 gap-2">
                              {task.subtasks.map(s => (
                                <div key={s.id} className="bg-slate-900/60 p-2.5 rounded border border-slate-700/40 text-xs flex justify-between items-center">
                                  <div>
                                    <span className="font-medium text-slate-200">{s.title}</span>
                                    {s.lead && <span className="text-slate-400 ml-2">(Lead: {s.lead})</span>}
                                  </div>
                                  <div className="flex space-x-3 text-[11px]">
                                    {s.soft1 && <span className="text-amber-400">Soft 1: {s.soft1}</span>}
                                    {s.soft2 && <span className="text-amber-400">Soft 2: {s.soft2}</span>}
                                    {s.hard && <span className="text-red-400 font-bold">Hard: {s.hard}</span>}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* TAB 4: COMPLETED ARCHIVE */}
            {activeTab === "archive" && (
              <div className="space-y-3">
                {archivedTasks.length === 0 ? (
                  <div className="bg-slate-800/40 p-8 text-center text-slate-400 rounded-xl border border-slate-700">No completed tasks archived yet.</div>
                ) : (
                  archivedTasks.map(task => (
                    <div key={task.id} className="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4 flex justify-between items-center opacity-75">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 text-xs rounded border border-emerald-500/30 font-semibold">{task.portfolio}</span>
                          <h3 className="line-through font-medium text-slate-300">{task.title}</h3>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">Lead: {task.leadName}</p>
                      </div>
                      <button onClick={() => handleStatusChange(task.id, "In Progress")} className="text-xs text-indigo-400 hover:underline">Unarchive</button>
                    </div>
                  ))
                )}
              </div>
            )}
          </main>

          {/* Firebase Modal */}
          {showFirebaseModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4">
                <h3 className="text-lg font-bold text-slate-100 flex items-center space-x-2">
                  <Icons.Cloud />
                  <span>Connect Free Firebase Cloud Sync</span>
                </h3>
                <p className="text-xs text-slate-400">
                  Paste your `firebaseConfig` object from your Firebase Console below to turn on instant multi-device syncing.
                </p>
                <textarea 
                  rows="8"
                  value={configInput}
                  onChange={e => setConfigInput(e.target.value)}
                  placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app-id",\n  "storageBucket": "your-app.appspot.com",\n  "messagingSenderId": "123456789",\n  "appId": "1:123456789:web:abc"\n}`}
                  className="w-full bg-slate-900 border border-slate-700 rounded p-3 font-mono text-xs text-slate-200"
                ></textarea>
                <div className="flex justify-end space-x-2">
                  <button onClick={() => setShowFirebaseModal(false)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs">Cancel</button>
                  <button onClick={handleSaveFirebaseConfig} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">Connect & Sync</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<TaskManagerApp />, document.getElementById('root'));
  </script>
</body>
</html>
